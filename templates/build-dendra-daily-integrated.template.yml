name: Dendra integrated manual publication (INACTIVE REVIEW TEMPLATE)
# Intentionally outside .github/workflows. Requires separate D2B approval.
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Explicit first publication only; 30 moisture / 90 temperature days, no historical migration
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-r-hardened
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::digest
      - name: Offline safeguards before acquisition
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla tests/dendra/test_core.R
          python3 -m unittest discover -s tests/dendra -p 'test_*.py' -v
      - name: Restore authoritative committed daily state or explicit first bootstrap
        shell: bash
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git worktree add --detach "$RUNNER_TEMP/dendra-public" refs/remotes/origin/main
          if test -f "$RUNNER_TEMP/dendra-public/docs/data/dendra/index.json"; then
            test "$BOOTSTRAP" = false
            python3 scripts/dendra_state.py restore-public --repo "$RUNNER_TEMP/dendra-public" --state "$RUNNER_TEMP/dendra-state"
            echo update > "$RUNNER_TEMP/dendra-mode"
          else
            test "$BOOTSTRAP" = true
            test ! -d "$RUNNER_TEMP/dendra-public/docs/data/dendra"
            echo backfill > "$RUNNER_TEMP/dendra-mode"
          fi
      - name: Verify configured public identities
        shell: bash
        run: |
          set -euo pipefail
          station_id="$(python3 -c 'import json; print(json.load(open("data/input/dendra/combined_selection.json"))["station_id"])')"
          python3 scripts/dendra/bridge.py discover --catalog data/input/dendra/pilot_catalog.json --station "$station_id" --output "$RUNNER_TEMP/dendra-discovery" --ledger "$RUNNER_TEMP/dendra-http.json" --budget 80
          python3 scripts/dendra_workflow.py select --catalog data/input/dendra/pilot_catalog.json --discovery "$RUNNER_TEMP/dendra-discovery" --selection data/input/dendra/combined_selection.json --output "$RUNNER_TEMP/dendra-catalog.json"
      - name: R preparation with parameter-specific windows and exact transfer closure
        shell: bash
        run: |
          set -euo pipefail
          mode="$(cat "$RUNNER_TEMP/dendra-mode")"
          Rscript --vanilla scripts/build_dendra_daily.R --mode "$mode" --catalog "$RUNNER_TEMP/dendra-catalog.json" --state "$RUNNER_TEMP/dendra-state" --output "$RUNNER_TEMP/dendra-output" --ledger "$RUNNER_TEMP/dendra-http.json" --budget 80
          candidate="$(python3 -c 'import json,os,pathlib; s=pathlib.Path(os.environ["RUNNER_TEMP"])/"dendra-state"; p=json.load(open(s/"current.json")); print(s/p["candidate_relpath"])')"
          python3 scripts/dendra_candidate.py prepare --root "$candidate" --source-sha "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/dendra-transfer"
          cp -R "$candidate" "$RUNNER_TEMP/dendra-transfer/candidate"
          cp "$(dirname "$candidate")/candidate-metadata.json" "$RUNNER_TEMP/dendra-transfer/candidate-metadata.json"
          python3 scripts/dendra_candidate.py validate --root "$RUNNER_TEMP/dendra-transfer/candidate"
      - uses: actions/upload-artifact@v7
        with:
          name: dendra-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dendra-transfer
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: dendra-acquisition-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dendra-http.json
            ${{ runner.temp }}/dendra-state/runs/*/loss_assessment.json
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max
    env:
      BRIM_LIVE_MAIN_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-r-hardened
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::digest
      - uses: actions/download-artifact@v8
        with:
          name: dendra-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dendra-transfer
      - name: Actual shared main transaction with Dendra callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/main_publisher.py publish \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-root "$RUNNER_TEMP/dendra-transfer/candidate" \
            --metadata "$RUNNER_TEMP/dendra-transfer/candidate-metadata.json" \
            --product-id dendra-daily --target-ref refs/heads/main \
            --commit-subject 'Update Dendra prepared daily feed' \
            --allowlist docs/data/dendra/index.json \
            --owned-root docs/data/dendra/history \
            --owned-root docs/data/dendra/diagnostics \
            --owned-root docs/data/dendra/companion \
            --owned-root docs/data/dendra/state \
            --candidate-validator scripts/dendra_publisher.py \
            --reconcile-callback scripts/dendra_publisher.py \
            --staged-validator scripts/dendra_publisher.py
          # The next run restores committed main. A prepared pointer or artifact
          # never becomes acknowledgement merely because the build succeeded.
