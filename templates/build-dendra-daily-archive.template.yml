name: Dendra archive2 manual update (INACTIVE REVIEW TEMPLATE)
# Intentionally outside .github/workflows. Requires separate operational approval. No automatic first live bootstrap.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.DENDRA_ARCHIVE_DEPLOYMENT_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-r-hardened
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::digest
            any::yaml
      - name: Offline safeguards before acquisition
        shell: bash
        run: |
          set -euo pipefail
          Rscript --vanilla tests/dendra/test_core.R
          python3 -m unittest discover -s tests/dendra -p 'test_*.py' -v
          Rscript --vanilla tests/dendra/test_archive_template.R
      - name: Restore acknowledged archive2 state; otherwise stop at seed review gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git worktree add --detach "$RUNNER_TEMP/dendra-public" refs/remotes/origin/main
          test -f "$RUNNER_TEMP/dendra-public/docs/data/dendra/index.json"
          python3 -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/dendra-public/docs/data/dendra/index.json"; assert json.load(open(p))["integration_version"]=="dendra-integration-2"'
          python3 scripts/dendra_state.py restore-public --repo "$RUNNER_TEMP/dendra-public" --state "$RUNNER_TEMP/dendra-state"
          # Initial historical import is a separate offline --mode bootstrap review.
          # A prepared seed is not an acknowledged publication or automatic fallback.
      - name: Verify configured public identities
        shell: bash
        run: |
          set -euo pipefail
          station_id="$(python3 -c 'import json; print(json.load(open("data/input/dendra/archive_selection.REVIEW_REQUIRED.json"))["station_id"])')"
          python3 scripts/dendra/bridge.py discover --catalog data/input/dendra/pilot_catalog.json --station "$station_id" --output "$RUNNER_TEMP/dendra-discovery" --ledger "$RUNNER_TEMP/dendra-http.json" --budget 80
          python3 scripts/dendra_workflow.py select --catalog data/input/dendra/pilot_catalog.json --discovery "$RUNNER_TEMP/dendra-discovery" --selection data/input/dendra/archive_selection.REVIEW_REQUIRED.json --output "$RUNNER_TEMP/dendra-catalog.json"
      - name: R preparation with parameter-specific windows and exact transfer closure
        shell: bash
        run: |
          set -euo pipefail
          asof="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          Rscript --vanilla scripts/build_dendra_daily.R --mode update --as-of "$asof" --catalog "$RUNNER_TEMP/dendra-catalog.json" --state "$RUNNER_TEMP/dendra-state" --output "$RUNNER_TEMP/dendra-output" --ledger "$RUNNER_TEMP/dendra-http.json" --budget 80
          # One operation validates preparation, transferred bytes and role-prepared export.
          # publication/{candidate,candidate-metadata.json} has exact publisher closure;
          # a prepared-state.json envelope binds that one complete byte set.
          python3 scripts/dendra_state.py transfer --state "$RUNNER_TEMP/dendra-state" --destination "$RUNNER_TEMP/dendra-transfer" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: dendra-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dendra-transfer
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: dendra-acquisition-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dendra-http.json
            ${{ runner.temp }}/dendra-state/runs/*/loss_assessment.json
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && vars.DENDRA_ARCHIVE_DEPLOYMENT_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max
      # Matches the pinned shared writers; hosted behavior still needs deployment validation.
    env:
      BRIM_LIVE_MAIN_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-r-hardened
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::digest
            any::yaml
      - uses: actions/download-artifact@v8
        with:
          name: dendra-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dendra-transfer
      - name: Actual shared main transaction with Dendra callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/main_publisher.py publish \
            --repo "$GITHUB_WORKSPACE" \
            --candidate-root "$RUNNER_TEMP/dendra-transfer/publication/candidate" \
            --metadata "$RUNNER_TEMP/dendra-transfer/publication/candidate-metadata.json" \
            --product-id dendra-daily --target-ref refs/heads/main \
            --commit-subject 'Update Dendra prepared daily feed' \
            --allowlist docs/data/dendra/index.json \
            --owned-root docs/data/dendra/history \
            --owned-root docs/data/dendra/diagnostics \
            --owned-root docs/data/dendra/companion \
            --owned-root docs/data/dendra/state \
            --candidate-validator scripts/dendra_publisher.py \
            --reconcile-callback scripts/dendra_publisher.py \
            --staged-validator scripts/dendra_publisher.py
          # The next run restores committed main. A prepared pointer or artifact
          # never becomes acknowledgement merely because the build succeeded.
