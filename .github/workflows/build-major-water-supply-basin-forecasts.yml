name: Build major water-supply basin forecasts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated feed (main branch only)
        required: false
        default: false
        type: boolean
      logical_slot:
        description: Optional repair slot in YYYY-MM-DD-AM/PM form
        required: false
        type: string
  schedule:
    - cron: "56 10,16 * * *"
      timezone: "America/Los_Angeles"

permissions:
  contents: write

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out selected branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Resolve publication mode and logical slot
        id: run-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish || false }}
          LOGICAL_SLOT_INPUT: ${{ inputs.logical_slot || '' }}
        run: |
          set -euo pipefail

          publish=false
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${REF_NAME}" != "main" ]]; then
              echo "Scheduled publication is restricted to main." >&2
              exit 1
            fi
            publish=true
          elif [[ "${PUBLISH_INPUT}" == "true" && "${REF_NAME}" == "main" ]]; then
            publish=true
          fi

          slot_args=()
          if [[ -n "${LOGICAL_SLOT_INPUT}" ]]; then
            slot_args=(--override "${LOGICAL_SLOT_INPUT}")
          fi
          logical_slot="$(python3 scripts/cnrfc_forecast_slot.py "${slot_args[@]}")"

          if [[ "${publish}" == "true" ]]; then
            output_path="docs/data/major_water_supply_basin_forecasts.json"
          else
            output_path="${RUNNER_TEMP}/major_water_supply_basin_forecasts_dry_run.json"
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "logical_slot=${logical_slot}" >> "${GITHUB_OUTPUT}"
          echo "output_path=${output_path}" >> "${GITHUB_OUTPUT}"
          echo "Publication enabled: ${publish}; logical slot: ${logical_slot}"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: cnrfc-major-water-supply-v2
          packages: |
            any::curl
            any::digest
            any::jsonlite
            any::xml2

      - name: Build and validate major water-supply basin forecast feed
        shell: Rscript {0}
        env:
          CNRFC_FORECAST_OUTPUT_JSON: ${{ steps.run-mode.outputs.output_path }}
          CNRFC_FORECAST_PRIOR_JSON: docs/data/major_water_supply_basin_forecasts.json
          CNRFC_FORECAST_QA_JSON: ${{ runner.temp }}/major_water_supply_basin_forecasts_run.json
          CNRFC_FORECAST_LOGICAL_SLOT: ${{ steps.run-mode.outputs.logical_slot }}
          CNRFC_FORECAST_WATER_YEAR_STALE_HOURS: "72"
          CNRFC_FORECAST_WATER_YEAR_EXPIRES_HOURS: "168"
          CNRFC_FORECAST_ACCUMULATION_STALE_HOURS: "36"
          CNRFC_FORECAST_APRIL_JULY_STALE_HOURS: "36"
        run: |
          source("scripts/build_major_water_supply_basin_forecasts.R")

      - name: Upload CNRFC forecast run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: major-water-supply-basin-forecasts-qa
          path: ${{ runner.temp }}/major_water_supply_basin_forecasts_run.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit updated feed file
        if: steps.run-mode.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" || "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Refusing to publish outside the main branch: ${GITHUB_REF}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/major_water_supply_basin_forecasts.json

          if git diff --cached --quiet; then
            echo "No substantive major water-supply basin forecast changes to commit."
            exit 0
          fi

          git commit -m "Update major water-supply basin forecast feed"

          if ! git push origin "HEAD:${GITHUB_REF}"; then
            echo "The selected branch advanced unexpectedly; nothing was published." >&2
            echo "Rerun this workflow from the latest branch tip." >&2
            exit 1
          fi
