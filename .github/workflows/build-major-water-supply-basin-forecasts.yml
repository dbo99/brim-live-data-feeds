name: Build major water-supply basin forecasts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated feed (main branch only)
        required: false
        default: false
        type: boolean
      logical_slot:
        description: Optional repair slot in YYYY-MM-DD-AM/PM form
        required: false
        type: string
  schedule:
    - cron: "56 10,16 * * *"
      timezone: "America/Los_Angeles"

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.run-mode.outputs.publish }}
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out selected branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Record candidate source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve publication mode and logical slot
        id: run-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish || false }}
          LOGICAL_SLOT_INPUT: ${{ inputs.logical_slot || '' }}
        run: |
          set -euo pipefail

          publish=false
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${REF_NAME}" != "main" ]]; then
              echo "Scheduled publication is restricted to main." >&2
              exit 1
            fi
            publish=true
          elif [[ "${PUBLISH_INPUT}" == "true" && "${REF_NAME}" == "main" ]]; then
            publish=true
          fi

          slot_args=()
          if [[ -n "${LOGICAL_SLOT_INPUT}" ]]; then
            slot_args=(--override "${LOGICAL_SLOT_INPUT}")
          fi
          logical_slot="$(python3 scripts/cnrfc_forecast_slot.py "${slot_args[@]}")"
          candidate_artifact_root="${RUNNER_TEMP}/cnrfc-forecast-candidate"
          output_path="${candidate_artifact_root}/candidate/docs/data/major_water_supply_basin_forecasts.json"

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "logical_slot=${logical_slot}" >> "${GITHUB_OUTPUT}"
          echo "output_path=${output_path}" >> "${GITHUB_OUTPUT}"
          echo "Publication enabled: ${publish}; logical slot: ${logical_slot}"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: cnrfc-major-water-supply-v2
          packages: |
            any::curl
            any::digest
            any::jsonlite
            any::xml2

      - name: Seed isolated CNRFC candidate path
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.run-mode.outputs.output_path }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          if [[ -f docs/data/major_water_supply_basin_forecasts.json ]]; then
            install -m 0644 \
              docs/data/major_water_supply_basin_forecasts.json \
              "${OUTPUT_PATH}"
          fi

      - name: Build and validate isolated CNRFC candidate
        shell: Rscript {0}
        env:
          CNRFC_FORECAST_OUTPUT_JSON: ${{ steps.run-mode.outputs.output_path }}
          CNRFC_FORECAST_PRIOR_JSON: docs/data/major_water_supply_basin_forecasts.json
          CNRFC_FORECAST_QA_JSON: ${{ runner.temp }}/major_water_supply_basin_forecasts_run.json
          CNRFC_FORECAST_LOGICAL_SLOT: ${{ steps.run-mode.outputs.logical_slot }}
          CNRFC_FORECAST_WATER_YEAR_STALE_HOURS: "72"
          CNRFC_FORECAST_WATER_YEAR_EXPIRES_HOURS: "168"
          CNRFC_FORECAST_ACCUMULATION_STALE_HOURS: "36"
          CNRFC_FORECAST_APRIL_JULY_STALE_HOURS: "36"
        run: |
          source("scripts/build_major_water_supply_basin_forecasts.R")

      - name: Validate and describe CNRFC candidate artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cnrfc-forecast-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/cnrfc_forecast_publisher.py validate \
            --root "${candidate_root}"
          semantic_state="$(python3 scripts/cnrfc_forecast_publisher.py semantic-key \
            --root "${candidate_root}")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cnrfc-major-water-supply-forecasts \
            --semantic-key-type cnrfc_record_state_sha256_v1 \
            --semantic-key "${semantic_state}" \
            --source-event-sha "${SOURCE_SHA}" \
            --allowlist docs/data/major_water_supply_basin_forecasts.json

      - name: Upload validated CNRFC publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: cnrfc-forecast-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cnrfc-forecast-candidate
          if-no-files-found: error
          retention-days: 2

      - name: Upload CNRFC forecast run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: major-water-supply-basin-forecasts-qa
          path: ${{ runner.temp }}/major_water_supply_basin_forecasts_run.json
          if-no-files-found: warn
          retention-days: 14

  publish-to-main:
    if: ${{ needs.prepare-candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out candidate source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          fetch-depth: 0

      - name: Download validated CNRFC publication candidate
        uses: actions/download-artifact@v8
        with:
          name: cnrfc-forecast-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cnrfc-forecast-candidate

      - name: Reconcile and publish CNRFC candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
          CANDIDATE_SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cnrfc-forecast-candidate"
          export GITHUB_SHA="${CANDIDATE_SOURCE_SHA}"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cnrfc-major-water-supply-forecasts \
            --target-ref refs/heads/main \
            --commit-subject "Update major water-supply basin forecast feed" \
            --allowlist docs/data/major_water_supply_basin_forecasts.json \
            --candidate-validator scripts/cnrfc_forecast_publisher.py \
            --reconcile-callback scripts/cnrfc_forecast_publisher.py \
            --staged-validator scripts/cnrfc_forecast_publisher.py
