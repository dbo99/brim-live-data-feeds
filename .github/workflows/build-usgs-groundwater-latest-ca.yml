name: Build USGS CA groundwater latest GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Daily. Groundwater field measurements are low-frequency site-visit data,
    # so a daily refresh is sufficient for BRIM Ops Live.
    - cron: "41 13 * * *"

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: ./.github/actions/setup-r-hardened

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: usgs-groundwater-v3-2yr
          packages: |
            any::dataRetrieval
            any::dplyr
            any::readr
            any::lubridate
            any::jsonlite
            any::tibble
            any::curl

      - name: Build isolated USGS groundwater candidate
        shell: Rscript {0}
        env:
          USGS_GW_FIELD_MEASUREMENTS_LOOKBACK_DAYS: "800"
          USGS_GW_MIN_API_SITES_TO_PUBLISH: "300"
          USGS_GW_MIN_FEATURES_TO_PUBLISH: "300"
          USGS_GW_ALLOW_INDEX_FALLBACK: "true"
          USGS_GW_GEOJSON: ${{ runner.temp }}/usgs-groundwater-candidate/candidate/docs/data/usgs_groundwater_latest_ca.geojson
          USGS_GW_SUMMARY_JSON: ${{ runner.temp }}/usgs-groundwater-candidate/candidate/docs/data/usgs_groundwater_latest_ca_summary.json
          # Optional: create this repository secret for higher USGS Water Data API rate limits.
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
        run: |
          source("scripts/build_usgs_groundwater_latest_ca.R")

      - name: Validate and describe USGS groundwater candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/usgs-groundwater-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/usgs_groundwater_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/usgs_groundwater_latest_ca_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id usgs-groundwater-latest-ca \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/usgs_groundwater_latest_ca.geojson \
            --allowlist docs/data/usgs_groundwater_latest_ca_summary.json

      - name: Upload validated USGS groundwater publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: usgs-groundwater-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usgs-groundwater-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated USGS groundwater publication candidate
        uses: actions/download-artifact@v8
        with:
          name: usgs-groundwater-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usgs-groundwater-candidate

      - name: Reconcile and publish USGS groundwater candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/usgs-groundwater-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id usgs-groundwater-latest-ca \
            --target-ref refs/heads/main \
            --commit-subject "Update USGS CA groundwater latest feed" \
            --allowlist docs/data/usgs_groundwater_latest_ca.geojson \
            --allowlist docs/data/usgs_groundwater_latest_ca_summary.json \
            --candidate-validator scripts/usgs_groundwater_publisher.py \
            --reconcile-callback scripts/usgs_groundwater_publisher.py \
            --staged-validator scripts/usgs_groundwater_publisher.py
