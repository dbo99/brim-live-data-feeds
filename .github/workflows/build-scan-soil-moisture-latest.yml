name: Build SCAN soil moisture latest feed

on:
  schedule:
    # Daily at 14:30 UTC = 6:30 AM PST / 7:30 AM PDT.
    # The feed script looks back several days and reports observation age, so
    # exact provider update timing does not need to be perfect.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-scan-soil-moisture-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: scan-soil-moisture-latest-v4
          packages: |
            any::soilDB
            any::httr
            any::curl
            any::dplyr
            any::readr
            any::lubridate
            any::jsonlite
            any::tibble
            any::purrr
            any::stringr
            any::tidyr

      - name: Build SCAN soil moisture latest feed
        shell: Rscript {0}
        env:
          SCAN_NWCC_PREFLIGHT_RETRIES: "3"
          SCAN_NWCC_PREFLIGHT_PAUSE_SEC: "10"
          SCAN_NWCC_PREFLIGHT_TIMEOUT_SEC: "20"
          SCAN_FETCH_RETRIES: "3"
          SCAN_FETCH_RETRY_PAUSE_SEC: "6"
          SCAN_FETCH_TIMEOUT_SEC: "60"
          SCAN_SMS_REQUEST_PAUSE_SEC: "0.35"
        run: |
          source("scripts/build_scan_soil_moisture_latest.R")

      - name: Commit updated feed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/scan_soil_moisture_latest.geojson \
            docs/data/scan_soil_moisture_latest_summary.json \
            docs/data/scan_soil_moisture_current_wy_trace.csv \
            docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            docs/data/scan_depth_style.csv
          if git diff --cached --quiet; then
            echo "No SCAN feed changes to commit."
          else
            git commit -m "Update SCAN soil moisture latest feed"
            git pull --rebase origin main
            git push
          fi
