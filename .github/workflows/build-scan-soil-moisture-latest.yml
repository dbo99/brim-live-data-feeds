name: Build SCAN soil moisture latest feed

on:
  schedule:
    # Daily at 14:30 UTC = 6:30 AM PST / 7:30 AM PDT.
    # The feed script looks back several days and reports observation age, so
    # exact provider update timing does not need to be perfect.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: scan-soil-moisture-latest-v4
          packages: |
            any::soilDB
            any::httr
            any::curl
            any::dplyr
            any::readr
            any::lubridate
            any::jsonlite
            any::tibble
            any::purrr
            any::stringr
            any::tidyr

      - name: Prepare isolated SCAN candidate directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scan-soil-moisture-candidate/candidate"

      - name: Build SCAN soil moisture latest feed
        shell: Rscript {0}
        working-directory: ${{ runner.temp }}/scan-soil-moisture-candidate/candidate
        env:
          SCAN_STATION_INDEX_CSV: ${{ github.workspace }}/data/input/scan_station_index.csv
          SCAN_SMS_PERCENTILES_CSV: ${{ github.workspace }}/data/input/scan_sms_waterday_percentiles.csv
          SCAN_DEPTH_STYLE_CSV: ${{ github.workspace }}/data/input/scan_depth_style.csv
          SCAN_NWCC_PREFLIGHT_RETRIES: "3"
          SCAN_NWCC_PREFLIGHT_PAUSE_SEC: "10"
          SCAN_NWCC_PREFLIGHT_TIMEOUT_SEC: "20"
          SCAN_FETCH_RETRIES: "3"
          SCAN_FETCH_RETRY_PAUSE_SEC: "6"
          SCAN_FETCH_TIMEOUT_SEC: "60"
          SCAN_SMS_REQUEST_PAUSE_SEC: "0.35"
        run: |
          source(file.path(Sys.getenv("GITHUB_WORKSPACE"), "scripts/build_scan_soil_moisture_latest.R"))

      - name: Validate and describe SCAN candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/scan-soil-moisture-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/scan_soil_moisture_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/scan_soil_moisture_latest_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id scan-soil-moisture-latest \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/scan_soil_moisture_latest.geojson \
            --allowlist docs/data/scan_soil_moisture_latest_summary.json \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace.csv \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            --allowlist docs/data/scan_depth_style.csv

      - name: Upload validated SCAN publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: scan-soil-moisture-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-soil-moisture-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated SCAN publication candidate
        uses: actions/download-artifact@v8
        with:
          name: scan-soil-moisture-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-soil-moisture-candidate

      - name: Reconcile and publish SCAN candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/scan-soil-moisture-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id scan-soil-moisture-latest \
            --target-ref refs/heads/main \
            --commit-subject "Update SCAN soil moisture latest feed" \
            --allowlist docs/data/scan_soil_moisture_latest.geojson \
            --allowlist docs/data/scan_soil_moisture_latest_summary.json \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace.csv \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            --allowlist docs/data/scan_depth_style.csv \
            --candidate-validator scripts/scan_soil_moisture_publisher.py \
            --reconcile-callback scripts/scan_soil_moisture_publisher.py \
            --staged-validator scripts/scan_soil_moisture_publisher.py
