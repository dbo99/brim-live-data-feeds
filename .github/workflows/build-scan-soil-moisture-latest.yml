name: Build SCAN soil moisture latest feed

on:
  schedule:
    # Daily at 14:30 UTC = 6:30 AM PST / 7:30 AM PDT.
    # The feed script looks back several days and reports observation age, so
    # exact provider update timing does not need to be perfect.
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      acquire_only:
        description: "Validate and retain a candidate without publication (separate finite approval required)"
        type: boolean
        default: false
        required: false
      source_cutoff_date:
        description: "Frozen eligible source date YYYY-MM-DD; required for acquire-only"
        type: string
        default: ""
        required: false

permissions: {}

jobs:
  refuse-private-acquisition:
    if: ${{ inputs.acquire_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Refuse acquisition without approved private custody
        shell: bash
        run: |
          printf '%s\n' 'SCAN acquire-only held: no approved durable private candidate and receipt custody route.' >&2
          exit 1

  prepare-candidate:
    # Job-level exclusion prevents grant environment and collector logs as well
    # as artifact disclosure. Public Actions artifacts are not private custody.
    if: ${{ inputs.acquire_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    concurrency:
      group: scan-nrcs-finite-campaign
      cancel-in-progress: false
      queue: max
    outputs:
      release_not_after: ${{ steps.admission.outputs.release_not_after }}

    env:
      SCAN_SOURCE_CUTOFF_DATE: ${{ inputs.source_cutoff_date }}
      SCAN_ACQUIRE_ONLY: ${{ inputs.acquire_only == true && 'true' || 'false' }}
      SCAN_LIVE_APPROVAL_JSON: ${{ vars.SCAN_LIVE_APPROVAL_JSON }}
      SCAN_DAILY_PILOT_JSON: ${{ vars.SCAN_DAILY_PILOT_JSON }}
      SCAN_PROVIDER_HOLD: ${{ vars.SCAN_PROVIDER_HOLD }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source event
        timeout-minutes: 5
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require finite manual or scheduled admission
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/scan_operational_guard.py initial

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        timeout-minutes: 2
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        timeout-minutes: 12
        uses: ./.github/actions/setup-r-hardened

      - name: Provision the supported bounded SCAN runtime
        timeout-minutes: 31
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/soil_moisture/run_sms_hosted_qualification.py supervise \
            --output "${RUNNER_TEMP}/scan-runtime-monitor" --seconds 1800 -- \
            python3 scripts/run_scan_operational.py \
              --output "${RUNNER_TEMP}/scan-provision-bounded" --root "${RUNNER_TEMP}" --seconds 1770 -- \
              python3 tests/soil_moisture/run_sms_hosted_qualification.py provision \
                --output "${RUNNER_TEMP}/scan-runtime"
          cp "${RUNNER_TEMP}/scan-runtime/RESOLVED_RUNTIME_LOCK.json" \
            "${RUNNER_TEMP}/scan-control/runtime-lock.json"

      - name: Qualify actual Linux SCAN runtime without external egress
        timeout-minutes: 5
        run: bash tests/soil_moisture/run_scan_operational_qualification.sh

      - name: Prepare isolated SCAN candidate directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scan-soil-moisture-candidate/candidate"

      - name: Recheck admission and reserve this campaign once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/scan_operational_guard.py pre-acquisition

      - name: Build SCAN soil moisture latest feed
        id: build
        timeout-minutes: 21
        shell: bash
        working-directory: ${{ runner.temp }}/scan-soil-moisture-candidate/candidate
        env:
          SCAN_STATION_INDEX_CSV: ${{ github.workspace }}/data/input/scan_station_index.csv
          SCAN_SMS_PERCENTILES_CSV: ${{ github.workspace }}/data/input/scan_sms_waterday_percentiles.csv
          SCAN_DEPTH_STYLE_CSV: ${{ github.workspace }}/data/input/scan_depth_style.csv
          SCAN_NWCC_PREFLIGHT_RETRIES: "1"
          SCAN_NWCC_PREFLIGHT_PAUSE_SEC: "10"
          SCAN_NWCC_PREFLIGHT_TIMEOUT_SEC: "20"
          SCAN_FETCH_RETRIES: "1"
          SCAN_FETCH_RETRY_PAUSE_SEC: "6"
          SCAN_SMS_REQUEST_PAUSE_SEC: "0.35"
          SCAN_CANARY_MAX_REQUESTS: "1"
          SCAN_CANARY_MIN_SUCCESSES: "1"
          SCAN_CANARY_SITE_CODES: "2218"
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tests/soil_moisture/run_sms_hosted_qualification.py" supervise \
            --output "${RUNNER_TEMP}/scan-acquisition-monitor" --seconds 1200 -- \
            python3 "$GITHUB_WORKSPACE/scripts/run_scan_operational.py" \
              --output "${RUNNER_TEMP}/scan-acquisition-bounded" --root "${RUNNER_TEMP}" --seconds 1170 -- \
              Rscript --vanilla "$GITHUB_WORKSPACE/scripts/run_scan_operational.R"

      - name: Validate SCAN candidate
        id: validation
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_scan_operational.py \
            --output "${RUNNER_TEMP}/scan-validation-bounded" --root "${RUNNER_TEMP}" --seconds 90 -- \
            python3 scripts/scan_soil_moisture_publisher.py validate \
              --root "${RUNNER_TEMP}/scan-soil-moisture-candidate/candidate"

      - name: Describe SCAN candidate artifact
        id: candidate_metadata
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_scan_operational.py \
            --output "${RUNNER_TEMP}/scan-metadata-bounded" --root "${RUNNER_TEMP}" --seconds 90 -- \
            bash --noprofile --norc -euo pipefail -s <<'SCAN_METADATA'

          candidate_artifact_root="${RUNNER_TEMP}/scan-soil-moisture-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/scan_soil_moisture_latest_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id scan-soil-moisture-latest \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/scan_soil_moisture_latest.geojson \
            --allowlist docs/data/scan_soil_moisture_latest_summary.json \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace.csv \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            --allowlist docs/data/scan_depth_style.csv

          python3 scripts/run_scan_operational.py audit-candidate \
            "${candidate_artifact_root}" "${RUNNER_TEMP}/scan-control/runtime-account.json"
          SCAN_METADATA

      - name: Record fixed-label SCAN outcome
        if: ${{ always() && inputs.acquire_only != true }}
        timeout-minutes: 1
        env:
          SCAN_BUILD_OUTCOME: ${{ steps.build.outcome }}
          SCAN_VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          SCAN_METADATA_OUTCOME: ${{ steps.candidate_metadata.outcome }}
        run: |
          python3 scripts/run_scan_operational.py finalize "${RUNNER_TEMP}" \
            "${SCAN_BUILD_OUTCOME}" "${SCAN_VALIDATION_OUTCOME}" "${SCAN_METADATA_OUTCOME}"

      - name: Upload validated SCAN publication candidate
        if: ${{ success() && inputs.acquire_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-soil-moisture-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-soil-moisture-candidate
          if-no-files-found: error
          retention-days: 2


      - name: Retain bounded SCAN control and accounting receipts
        if: ${{ always() && inputs.acquire_only != true }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scan-control/approval-initial.json
            ${{ runner.temp }}/scan-control/approval-pre-acquisition.json
            ${{ runner.temp }}/scan-control/campaign-reservation.json
            ${{ runner.temp }}/scan-control/hosted-qualification.json
            ${{ runner.temp }}/scan-control/runtime-lock.json
            ${{ runner.temp }}/scan-control/runtime-account.json
            ${{ runner.temp }}/scan-control/failure-summary.json
          if-no-files-found: warn
          retention-days: 14

  publish-to-main:
    if: ${{ success() && github.ref == 'refs/heads/main' && inputs.acquire_only != true }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        timeout-minutes: 5
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated SCAN publication candidate
        uses: actions/download-artifact@v8
        with:
          name: scan-soil-moisture-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-soil-moisture-candidate

      - name: Reconcile and publish SCAN candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
          SCAN_RELEASE_NOT_AFTER: ${{ needs.prepare-candidate.outputs.release_not_after }}
        run: |
          set -euo pipefail

          python3 - <<'PYDEADLINE'
          import datetime, os
          end=datetime.datetime.fromisoformat(os.environ['SCAN_RELEASE_NOT_AFTER'].replace('Z','+00:00'))
          assert datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(seconds=900+900)<end, 'Publication/delivery fit unavailable'
          PYDEADLINE

          candidate_artifact_root="${RUNNER_TEMP}/scan-soil-moisture-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id scan-soil-moisture-latest \
            --target-ref refs/heads/main \
            --commit-subject "Update SCAN soil moisture latest feed" \
            --allowlist docs/data/scan_soil_moisture_latest.geojson \
            --allowlist docs/data/scan_soil_moisture_latest_summary.json \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace.csv \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            --allowlist docs/data/scan_depth_style.csv \
            --candidate-validator scripts/scan_soil_moisture_publisher.py \
            --reconcile-callback scripts/scan_soil_moisture_publisher.py \
            --staged-validator scripts/scan_soil_moisture_publisher.py
