name: Build SCAN soil moisture latest feed

on:
  schedule:
    # Daily at 14:30 UTC = 6:30 AM PST / 7:30 AM PDT.
    # The feed script looks back several days and reports observation age, so
    # exact provider update timing does not need to be perfect.
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      SCAN_LIVE_APPROVAL_JSON: ${{ vars.SCAN_LIVE_APPROVAL_JSON }}
      SCAN_HTTP_MAX_REQUESTS: ${{ vars.SCAN_HTTP_MAX_REQUESTS }}
      SCAN_HTTP_RESPONSE_BYTES: ${{ vars.SCAN_HTTP_RESPONSE_BYTES }}
      SCAN_HTTP_TOTAL_BYTES: ${{ vars.SCAN_HTTP_TOTAL_BYTES }}
      SCAN_HTTP_CAMPAIGN_SECONDS: ${{ vars.SCAN_HTTP_CAMPAIGN_SECONDS }}
      SCAN_FETCH_TIMEOUT_SEC: ${{ vars.SCAN_FETCH_TIMEOUT_SEC }}

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact future approval before any provider check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat > "${RUNNER_TEMP}/scan-approval-guard.py" <<'PYGUARD'
          # BEGIN SCAN_APPROVAL_GUARD
          import datetime, hashlib, json, math, os, re
          from pathlib import Path
          names = ("SCAN_HTTP_MAX_REQUESTS", "SCAN_HTTP_RESPONSE_BYTES", "SCAN_HTTP_TOTAL_BYTES", "SCAN_HTTP_CAMPAIGN_SECONDS", "SCAN_FETCH_TIMEOUT_SEC")
          receipt = {"source_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "status": "REFUSED", "provider_invoked_by_guard": False}
          try:
              raw = os.environ.get("SCAN_LIVE_APPROVAL_JSON", "")
              grant = json.loads(raw)
              assert set(grant) == {"approved", "approval_id", "source_sha", "run_number", "not_before_utc", "not_after_utc", "budgets"}
              assert grant["approved"] is True and re.fullmatch(r"[A-Za-z0-9_-]{1,80}", grant["approval_id"])
              assert os.environ["GITHUB_RUN_ATTEMPT"] == "1" and os.environ["GITHUB_REF"] == "refs/heads/main"
              assert re.fullmatch(r"[0-9a-f]{40}", receipt["source_sha"]) and grant["source_sha"] == receipt["source_sha"]
              assert type(grant["run_number"]) is int and grant["run_number"] == int(os.environ["GITHUB_RUN_NUMBER"])
              def stamp(value):
                  assert re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", value)
                  return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              start, end = stamp(grant["not_before_utc"]), stamp(grant["not_after_utc"])
              now = datetime.datetime.now(datetime.timezone.utc)
              assert start <= now < end and 0 < (end-start).total_seconds() <= 86400
              assert set(grant["budgets"]) == set(names)
              values = {}
              for name in names:
                  value = float(os.environ.get(name, ""))
                  assert math.isfinite(value) and value > 0 and type(grant["budgets"][name]) in (int,float) and value == grant["budgets"][name]
                  assert (value <= 2147483647 and value == int(value)) if name in names[:3] else value <= 86400
                  values[name] = value
              assert values["SCAN_HTTP_CAMPAIGN_SECONDS"] + 30 < (end-now).total_seconds()
              assert values["SCAN_FETCH_TIMEOUT_SEC"] <= values["SCAN_HTTP_CAMPAIGN_SECONDS"]
              receipt.update(status="APPROVED_FOR_THIS_FIRST_ATTEMPT", approval_sha256=hashlib.sha256(raw.encode()).hexdigest(), budgets=values, run_number=grant["run_number"], not_after_utc=grant["not_after_utc"])
          except Exception:
              raise SystemExit("SCAN has no valid first-attempt, source/run-bound finite approval")
          finally:
              root = Path(os.environ["RUNNER_TEMP"])/"scan-control"
              root.mkdir(exist_ok=True)
              (root/("approval-"+os.environ.get("SCAN_GUARD_PHASE","initial")+".json")).write_text(json.dumps(receipt,sort_keys=True)+"\n")
          # END SCAN_APPROVAL_GUARD
          PYGUARD
          python3 "${RUNNER_TEMP}/scan-approval-guard.py"

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: ./.github/actions/setup-r-hardened

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: scan-soil-moisture-latest-v4
          packages: |
            any::soilDB
            any::httr
            any::curl
            any::dplyr
            any::readr
            any::lubridate
            any::jsonlite
            any::tibble
            any::purrr
            any::stringr
            any::tidyr

      - name: Prepare isolated SCAN candidate directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/scan-soil-moisture-candidate/candidate"

      - name: Recheck the same approval immediately before acquisition
        env:
          SCAN_GUARD_PHASE: pre-acquisition
        run: python3 "${RUNNER_TEMP}/scan-approval-guard.py"

      - name: Build SCAN soil moisture latest feed
        shell: Rscript {0}
        working-directory: ${{ runner.temp }}/scan-soil-moisture-candidate/candidate
        env:
          SCAN_STATION_INDEX_CSV: ${{ github.workspace }}/data/input/scan_station_index.csv
          SCAN_SMS_PERCENTILES_CSV: ${{ github.workspace }}/data/input/scan_sms_waterday_percentiles.csv
          SCAN_DEPTH_STYLE_CSV: ${{ github.workspace }}/data/input/scan_depth_style.csv
          SCAN_NWCC_PREFLIGHT_RETRIES: "3"
          SCAN_NWCC_PREFLIGHT_PAUSE_SEC: "10"
          SCAN_NWCC_PREFLIGHT_TIMEOUT_SEC: "20"
          SCAN_FETCH_RETRIES: "3"
          SCAN_FETCH_RETRY_PAUSE_SEC: "6"
          SCAN_SMS_REQUEST_PAUSE_SEC: "0.35"
        run: |
          required <- c(soilDB="2.9.2", httr="1.4.9", curl="8.1.0")
          stopifnot(all(vapply(names(required), function(n) as.character(packageVersion(n)), character(1)) == required))
          grant <- jsonlite::fromJSON(Sys.getenv("SCAN_LIVE_APPROVAL_JSON"))
          remaining <- as.numeric(difftime(as.POSIXct(grant$not_after_utc, format="%Y-%m-%dT%H:%M:%SZ", tz="UTC"), Sys.time(), units="secs"))
          stopifnot(is.finite(remaining), remaining > as.numeric(Sys.getenv("SCAN_HTTP_CAMPAIGN_SECONDS")) + 30)
          scope <- new.env(parent=globalenv())
          failure <- tryCatch({
            source(file.path(Sys.getenv("GITHUB_WORKSPACE"), "scripts/build_scan_soil_moisture_latest.R"), local=scope)
            NULL
          }, error=identity)
          receipt <- list(source_sha=Sys.getenv("GITHUB_SHA"), run_id=Sys.getenv("GITHUB_RUN_ID"), run_attempt=Sys.getenv("GITHUB_RUN_ATTEMPT"), status=if(is.null(failure)) "BUILT" else "FAILED", error_class=if(is.null(failure)) NULL else class(failure)[1], account=if(exists("pt_scan_http",scope,inherits=FALSE)) scope$pt_scan_http$snapshot() else NULL)
          jsonlite::write_json(receipt, file.path(Sys.getenv("RUNNER_TEMP"), "scan-control", "runtime-account.json"), auto_unbox=TRUE, null="null")
          if(!is.null(failure)) stop(failure)

      - name: Validate and describe SCAN candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/scan-soil-moisture-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/scan_soil_moisture_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/scan_soil_moisture_latest_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id scan-soil-moisture-latest \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/scan_soil_moisture_latest.geojson \
            --allowlist docs/data/scan_soil_moisture_latest_summary.json \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace.csv \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            --allowlist docs/data/scan_depth_style.csv

      - name: Upload validated SCAN publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: scan-soil-moisture-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-soil-moisture-candidate
          if-no-files-found: error
          retention-days: 2


      - name: Retain bounded SCAN control and accounting receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: scan-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-control/*.json
          if-no-files-found: warn
          retention-days: 14

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated SCAN publication candidate
        uses: actions/download-artifact@v8
        with:
          name: scan-soil-moisture-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-soil-moisture-candidate

      - name: Reconcile and publish SCAN candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/scan-soil-moisture-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id scan-soil-moisture-latest \
            --target-ref refs/heads/main \
            --commit-subject "Update SCAN soil moisture latest feed" \
            --allowlist docs/data/scan_soil_moisture_latest.geojson \
            --allowlist docs/data/scan_soil_moisture_latest_summary.json \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace.csv \
            --allowlist docs/data/scan_soil_moisture_current_wy_trace_summary.json \
            --allowlist docs/data/scan_depth_style.csv \
            --candidate-validator scripts/scan_soil_moisture_publisher.py \
            --reconcile-callback scripts/scan_soil_moisture_publisher.py \
            --staged-validator scripts/scan_soil_moisture_publisher.py
