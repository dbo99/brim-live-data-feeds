name: Build Delta Ops daily summary GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Morning retries after normal DWR Delta Ops posting time.
    # GitHub schedules are UTC and may not run exactly on the minute.
    # These minutes avoid an exact collision with CoCoRaHS at 16:37 UTC and
    # stay away from the top of the hour.
    # During PDT these are about 8:41, 9:11, 9:41, 10:11, and 10:41 AM Pacific.
    # During PST they run one hour earlier unless adjusted seasonally.
    - cron: "41 15 * * *"
    - cron: "11,41 16 * * *"
    - cron: "11,41 17 * * *"

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.delta_ops_precheck.outputs.should_run }}

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Log trigger context
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Check if Delta Ops feed is already current
        id: delta_ops_precheck
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: bypassing same-date precheck."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "today=manual" >> "$GITHUB_OUTPUT"
            echo "existing=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          summary_path = "docs/data/delta_ops_daily_summary_summary.json"
          today = datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          existing = ""

          if os.path.exists(summary_path):
              try:
                  with open(summary_path, "r", encoding="utf-8") as f:
                      existing = str(json.load(f).get("report_date", ""))
              except Exception as exc:
                  print(f"Could not read existing summary JSON: {exc}")

          should_run = existing != today
          print(f"Pacific date today: {today}")
          print(f"Existing Delta Ops report date: {existing or '(none)'}")
          print(f"Should run fetch/build: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"should_run={str(should_run).lower()}", file=out)
              print(f"today={today}", file=out)
              print(f"existing={existing}", file=out)
          PY

      - name: Skip note
        if: steps.delta_ops_precheck.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Delta Ops feed already has report date ${{ steps.delta_ops_precheck.outputs.existing }} for Pacific date ${{ steps.delta_ops_precheck.outputs.today }}."
          echo "Skipping R setup, package install, PDF scrape, and commit."

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpoppler-cpp-dev

      - name: Install and verify R packages
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"))
          pkgs <- c("curl", "pdftools", "jsonlite", "readr", "tibble", "dplyr", "lubridate")
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) {
            install.packages(missing, Ncpus = max(1, parallel::detectCores() - 1))
          }
          still_missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("Missing required R packages after install: ", paste(still_missing, collapse = ", "))
          }
          cat("Installed/available R packages:\n")
          print(vapply(pkgs, function(p) as.character(utils::packageVersion(p)), character(1)))

      - name: Build latest Delta Ops daily summary GeoJSON
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: Rscript {0}
        env:
          DELTA_OPS_OUT_DIR: ${{ runner.temp }}/delta-ops-candidate/candidate/docs/data
        run: |
          source("scripts/build_delta_ops_daily_summary.R")

      - name: Validate and describe Delta Ops candidate artifact
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/delta-ops-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/delta_ops_publisher.py validate \
            --root "${candidate_root}"

          semantic_date="$(jq -er '.report_date' \
            "${candidate_root}/docs/data/delta_ops_daily_summary_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id delta-ops-daily-summary \
            --semantic-key-type report_date \
            --semantic-key "${semantic_date}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/delta_ops_daily_summary.json \
            --allowlist docs/data/delta_ops_daily_summary_features.geojson \
            --allowlist docs/data/delta_ops_daily_summary_summary.json \
            --allowlist docs/data/delta_ops_x2_reference.geojson

      - name: Upload validated Delta Ops publication candidate
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: delta-ops-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delta-ops-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' && needs.prepare-candidate.outputs.should_publish == 'true' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated Delta Ops publication candidate
        uses: actions/download-artifact@v8
        with:
          name: delta-ops-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delta-ops-candidate

      - name: Reconcile and publish Delta Ops candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/delta-ops-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id delta-ops-daily-summary \
            --target-ref refs/heads/main \
            --commit-subject "Update Delta Ops daily summary feed" \
            --allowlist docs/data/delta_ops_daily_summary.json \
            --allowlist docs/data/delta_ops_daily_summary_features.geojson \
            --allowlist docs/data/delta_ops_daily_summary_summary.json \
            --allowlist docs/data/delta_ops_x2_reference.geojson \
            --candidate-validator scripts/delta_ops_publisher.py \
            --reconcile-callback scripts/delta_ops_publisher.py \
            --staged-validator scripts/delta_ops_publisher.py
