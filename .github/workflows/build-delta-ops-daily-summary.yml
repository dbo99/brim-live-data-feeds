name: Build Delta Ops daily summary GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Daily retries after normal morning DWR Delta Ops posting time.
    # GitHub schedules are UTC and may not run exactly on the minute.
    # During PDT: 16:30 UTC = 9:30 AM Pacific; 18:30 UTC = 11:30 AM Pacific.
    - cron: "30 16,18 * * *"

permissions:
  contents: write

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpoppler-cpp-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("curl", "pdftools", "jsonlite", "readr", "tibble", "dplyr", "lubridate"),
            repos = "https://cloud.r-project.org"
          )

      - name: Build latest Delta Ops daily summary GeoJSON
        shell: Rscript {0}
        run: |
          source("scripts/build_delta_ops_daily_summary.R")

      - name: Commit updated feed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/delta_ops_daily_summary_features.geojson \
            docs/data/delta_ops_daily_summary_summary.json \
            docs/data/delta_ops_daily_summary.json \
            docs/data/delta_ops_x2_reference.geojson
          if git diff --cached --quiet; then
            echo "No Delta Ops feed changes to commit."
          else
            git commit -m "Update Delta Ops daily summary feed"
            git pull --rebase origin main
            git push
          fi
