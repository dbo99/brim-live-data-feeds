name: Build Delta Ops daily summary GeoJSON

on:
  workflow_dispatch:
    inputs:
      gmail_canary:
        description: "Nonpublishing Gmail proof (requires separate run approval)"
        type: boolean
        required: false
        default: false
      canary_source_sha:
        description: "Full approved source commit; must equal the main event and checkout"
        type: string
        required: false
        default: ""
  schedule:
    # Two daily Pacific opportunities, including weekends, through PST/PDT.
    # The second may skip acquisition if today's report is already published.
    # GitHub can delay/drop scheduled runs, especially at the top of the hour.
    # This cadence also governs the default PDF route and PDF fallback.
    - cron: '30 9,10 * * *'
      timezone: America/Los_Angeles

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.delta_ops_mode.outputs.is_canary != 'true' && steps.delta_ops_precheck.outputs.should_run == 'true' }}

    steps:
      - name: Check out selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gmail_canary == true && github.sha || github.ref }}
          fetch-depth: 0

      - name: Validate Delta mode and immutable canary source
        id: delta_ops_mode
        shell: bash
        env:
          CANARY_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.gmail_canary == true }}
          CANARY_SOURCE_SHA: ${{ inputs.canary_source_sha }}
          SOURCE_EVENT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          EMAIL_ENABLED: ${{ vars.DELTA_OPS_GMAIL_ENABLED }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path

          canary = os.environ["CANARY_REQUESTED"] == "true"
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ.get("CANARY_SOURCE_SHA", "")
          event = os.environ["SOURCE_EVENT_SHA"]
          if canary and (os.environ["SOURCE_REF"] != "refs/heads/main"
                         or not re.fullmatch(r"[0-9a-f]{40}", expected)
                         or expected != event or checkout != event):
              raise SystemExit("DELTA_CANARY_SOURCE_REJECTED")
          email = os.environ["SOURCE_REF"] == "refs/heads/main" and (
              canary or os.environ.get("EMAIL_ENABLED") == "true")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as out:
              print("is_canary=" + str(canary).lower(), file=out)
              print("use_gmail=" + str(email).lower(), file=out)
              print("checkout_sha=" + checkout, file=out)
          PYCODE

      - name: Log trigger context
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Check if Delta Ops feed is already current
        id: delta_ops_precheck
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: bypassing same-date precheck."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "today=manual" >> "$GITHUB_OUTPUT"
            echo "existing=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          summary_path = "docs/data/delta_ops_daily_summary_summary.json"
          today = datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          existing = ""

          if os.path.exists(summary_path):
              try:
                  with open(summary_path, "r", encoding="utf-8") as f:
                      existing = str(json.load(f).get("report_date", ""))
              except Exception as exc:
                  print(f"Could not read existing summary JSON: {exc}")

          should_run = existing != today
          print(f"Pacific date today: {today}")
          print(f"Existing Delta Ops report date: {existing or '(none)'}")
          print(f"Should run fetch/build: {should_run}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"should_run={str(should_run).lower()}", file=out)
              print(f"today={today}", file=out)
              print(f"existing={existing}", file=out)
          PY

      - name: Skip note
        if: steps.delta_ops_precheck.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Delta Ops feed already has report date ${{ steps.delta_ops_precheck.outputs.existing }} for Pacific date ${{ steps.delta_ops_precheck.outputs.today }}."
          echo "Skipping R setup, package install, PDF scrape, and commit."

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        uses: ./.github/actions/setup-r-hardened

      - name: Install Linux system libraries
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpoppler-cpp-dev

      - name: Install and verify R packages
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/jammy/latest"))
          pkgs <- c("curl", "pdftools", "jsonlite", "readr", "tibble", "dplyr", "lubridate")
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing) > 0) {
            install.packages(missing, Ncpus = max(1, parallel::detectCores() - 1))
          }
          still_missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still_missing) > 0) {
            stop("Missing required R packages after install: ", paste(still_missing, collapse = ", "))
          }
          cat("Installed/available R packages:\n")
          print(vapply(pkgs, function(p) as.character(utils::packageVersion(p)), character(1)))

      - name: Build latest Delta Ops daily summary GeoJSON
        if: steps.delta_ops_precheck.outputs.should_run == 'true' && steps.delta_ops_mode.outputs.use_gmail != 'true'
        shell: Rscript {0}
        env:
          DELTA_OPS_OUT_DIR: ${{ runner.temp }}/delta-ops-candidate/candidate/docs/data
          # Default route stays PDF-only. Saved input is private review only.
          DELTA_OPS_SAVED_EMAIL: ""
          DELTA_OPS_SELECTED_RECORD: ""
        run: |
          source("scripts/build_delta_ops_daily_summary.R")

      - name: Prepare optional Delta Gmail verification dependencies
        if: steps.delta_ops_precheck.outputs.should_run == 'true' && steps.delta_ops_mode.outputs.use_gmail == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Dependencies are confined to this optional preparation step. Failure
          # leaves verification unavailable and permits the bounded PDF route.
          if python3 -m venv "${RUNNER_TEMP}/delta-gmail-venv"; then
            export PATH="${RUNNER_TEMP}/delta-gmail-venv/bin:$PATH"
            sed -n 's/^# build: //p' requirements-delta-ops-gmail.txt > "${RUNNER_TEMP}/delta-gmail-build-requirements.txt"
            if python3 -m pip --isolated install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: --no-deps -r "${RUNNER_TEMP}/delta-gmail-build-requirements.txt" >/dev/null 2>&1 && \
               python3 -m pip --isolated install --disable-pip-version-check --no-cache-dir --require-hashes --no-build-isolation --no-deps -r requirements-delta-ops-gmail.txt >/dev/null 2>&1; then
              echo "DELTA_VERIFIER_DEPENDENCIES READY"
            else
              echo "DELTA_VERIFIER_DEPENDENCIES UNAVAILABLE"
            fi
          fi

      - name: Build Delta Ops through optional Gmail reader
        if: steps.delta_ops_precheck.outputs.should_run == 'true' && steps.delta_ops_mode.outputs.use_gmail == 'true'
        shell: bash
        env:
          # Ordinary operation is flag-gated; explicit canary still requires DKIM.
          DELTA_OPS_GMAIL_ENABLED: "true"
          DELTA_OPS_GMAIL_EXPECTED_ACCOUNT: ${{ secrets.DELTA_OPS_GMAIL_EXPECTED_ACCOUNT }}
          DELTA_OPS_GMAIL_EXPECTED_SENDER: ${{ vars.DELTA_OPS_GMAIL_EXPECTED_SENDER }}
          DELTA_OPS_GMAIL_CLIENT_ID: ${{ secrets.DELTA_OPS_GMAIL_CLIENT_ID }}
          DELTA_OPS_GMAIL_CLIENT_SECRET: ${{ secrets.DELTA_OPS_GMAIL_CLIENT_SECRET }}
          DELTA_OPS_GMAIL_REFRESH_TOKEN: ${{ secrets.DELTA_OPS_GMAIL_REFRESH_TOKEN }}
          DELTA_OPS_SAVED_EMAIL: ""
        run: |
          set -euo pipefail
          if [ -x "${RUNNER_TEMP}/delta-gmail-venv/bin/python3" ]; then
            export PATH="${RUNNER_TEMP}/delta-gmail-venv/bin:$PATH"
          fi
          python3 scripts/delta_ops_gmail.py build \
            --out-dir "${RUNNER_TEMP}/delta-ops-candidate/candidate/docs/data" \
            --artifact-metadata "${RUNNER_TEMP}/delta-ops-candidate/candidate-metadata.json"

      - name: Validate and describe Delta Ops candidate artifact
        if: steps.delta_ops_precheck.outputs.should_run == 'true' && steps.delta_ops_mode.outputs.use_gmail != 'true'
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/delta-ops-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/delta_ops_publisher.py validate \
            --root "${candidate_root}"

          semantic_date="$(jq -er '.report_date' \
            "${candidate_root}/docs/data/delta_ops_daily_summary_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id delta-ops-daily-summary \
            --semantic-key-type report_date \
            --semantic-key "${semantic_date}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/delta_ops_daily_summary.json \
            --allowlist docs/data/delta_ops_daily_summary_features.geojson \
            --allowlist docs/data/delta_ops_daily_summary_summary.json \
            --allowlist docs/data/delta_ops_x2_reference.geojson

      - name: Verify exact Delta artifact closure and validation
        id: delta_ops_artifact
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from main_publisher import validate_candidate_metadata
          from delta_ops_publisher import ALLOWLIST, PRODUCT_ID, validate_product
          from delta_ops_email import LABELS

          artifact = Path(os.environ["RUNNER_TEMP"]) / "delta-ops-candidate"
          root = artifact / "candidate"
          metadata = artifact / "candidate-metadata.json"
          try:
              # The existing preparation path validated with private evidence before
              # discarding it. Reuse its exact hash-bound five-file artifact here.
              validate_candidate_metadata(root=root, metadata_path=metadata,
                  product_id=PRODUCT_ID, allowlist=[str(p) for p in ALLOWLIST],
                  expected_source_sha=os.environ["GITHUB_SHA"])
              os.environ.update(BRIM_PUBLISH_PHASE="validate-candidate",
                  BRIM_PUBLISH_CANDIDATE_ROOT=str(root), BRIM_PUBLISH_METADATA=str(metadata))
              report_date, _ = validate_product(root)
              values = json.loads((root / "docs/data/delta_ops_daily_summary.json").read_text())
              coverage = sum(key in values["values"] for key in LABELS)
              kind = values["source_kind"]
              proof = (kind == "email" and values["review_only"] is False
                       and values.get("source_authentication") == "dkim-rsa-sha256-full-body"
                       and coverage == len(LABELS) == 17)
              with Path(os.environ["GITHUB_OUTPUT"]).open("a") as out:
                  print("gmail_proof=" + str(proof).lower(), file=out)
                  print("selected_transport=" + kind, file=out)
                  print("report_date=" + report_date, file=out)
                  print("required_field_coverage=" + str(coverage), file=out)
                  print("validation=PASS", file=out)
          except Exception:
              raise SystemExit("DELTA_ARTIFACT_REJECTED") from None
          PYCODE

      - name: Upload validated Delta Ops publication candidate
        if: steps.delta_ops_precheck.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: delta-ops-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delta-ops-candidate
          if-no-files-found: error
          retention-days: 2

      - name: Report nonpublishing Gmail canary result
        if: ${{ always() && steps.delta_ops_mode.outputs.is_canary == 'true' }}
        shell: bash
        env:
          CANARY_SOURCE_SHA: ${{ inputs.canary_source_sha }}
          SOURCE_EVENT_SHA: ${{ github.sha }}
          CHECKOUT_SHA: ${{ steps.delta_ops_mode.outputs.checkout_sha }}
          SELECTED_TRANSPORT: ${{ steps.delta_ops_artifact.outputs.selected_transport }}
          REPORT_DATE: ${{ steps.delta_ops_artifact.outputs.report_date }}
          REQUIRED_FIELD_COVERAGE: ${{ steps.delta_ops_artifact.outputs.required_field_coverage }}
          VALIDATION: ${{ steps.delta_ops_artifact.outputs.validation }}
          GMAIL_PROOF: ${{ steps.delta_ops_artifact.outputs.gmail_proof }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, re
          e = os.environ
          # Closed projections only: never serialize arbitrary runner/input data.
          sha = lambda value: value if re.fullmatch(r"[0-9a-f]{40}", value) else None
          kind = e.get("SELECTED_TRANSPORT")
          kind = kind if kind in {"email", "pdf"} else "none"
          date = e.get("REPORT_DATE", "")
          date = date if re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", date) else None
          count = e.get("REQUIRED_FIELD_COVERAGE", "")
          count = int(count) if re.fullmatch(r"(?:[0-9]|1[0-7])", count) else 0
          valid = e.get("VALIDATION") == "PASS"
          passed = e.get("GMAIL_PROOF") == "true" and valid and kind == "email" and count == 17
          result = {"expected_source_sha": sha(e.get("CANARY_SOURCE_SHA", "")),
                    "event_sha": sha(e.get("SOURCE_EVENT_SHA", "")),
                    "checkout_sha": sha(e.get("CHECKOUT_SHA", "")),
                    "selected_transport": kind, "report_heading_date": date,
                    "required_field_coverage": count, "required_fields": 17,
                    "validation": "PASS" if valid else "NOT_VALIDATED",
                    "gmail_proof": "PASS" if passed else "HELD",
                    "publication": "NOT_ATTEMPTED"}
          print("DELTA_CANARY " + json.dumps(result, sort_keys=True))
          if not passed:
              raise SystemExit("DELTA_CANARY_GMAIL_PROOF_HELD")
          PYCODE

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.gmail_canary == true) && needs.prepare-candidate.outputs.should_publish == 'true' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated Delta Ops publication candidate
        uses: actions/download-artifact@v8
        with:
          name: delta-ops-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delta-ops-candidate

      - name: Reconcile and publish Delta Ops candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/delta-ops-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id delta-ops-daily-summary \
            --target-ref refs/heads/main \
            --commit-subject "Update Delta Ops daily summary feed" \
            --allowlist docs/data/delta_ops_daily_summary.json \
            --allowlist docs/data/delta_ops_daily_summary_features.geojson \
            --allowlist docs/data/delta_ops_daily_summary_summary.json \
            --allowlist docs/data/delta_ops_x2_reference.geojson \
            --candidate-validator scripts/delta_ops_publisher.py \
            --reconcile-callback scripts/delta_ops_publisher.py \
            --staged-validator scripts/delta_ops_publisher.py
