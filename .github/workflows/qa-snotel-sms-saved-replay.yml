name: SCAN historical initial-admission QA

'on':
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Reviewed proof commit
        required: true
        type: string
      historical_window:
        description: Three historical UTC clock fields for the hash-bound fixture
        required: true
        type: string

permissions: {}

jobs:
  admission-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/scan-run164-hosted-admission-proof' && github.run_number == 4 && github.run_attempt == 1 && github.sha == inputs.expected_source_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the reviewed proof
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: reviewed
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/scan_operational_guard.py
            /tests/soil_moisture/prove_scan_initial_admission.py
      - name: Check out the historical event
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4d8d1c4b34d48495e4cc068bebe9c3b80658683a
          path: historical
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/setup-r-hardened/action.yml
            /.github/workflows/build-scan-soil-moisture-latest.yml
            /data/input/scan_depth_style.csv
            /data/input/scan_sms_waterday_percentiles.csv
            /data/input/scan_station_index.csv
            /scripts/build_scan_soil_moisture_latest.R
            /scripts/configure_apt_mirror_order.sh
            /scripts/main_publisher.py
            /scripts/run_scan_operational.R
            /scripts/run_scan_operational.py
            /scripts/scan_operational_guard.py
            /scripts/scan_soil_moisture_publisher.py
            /scripts/soil_moisture/scan_metered_http.R
            /scripts/soil_moisture/scan_nwcc_compat.R
            /tests/soil_moisture/hosted_runtime_lock.json
            /tests/soil_moisture/run_scan_operational_qualification.py
            /tests/soil_moisture/run_scan_operational_qualification.sh
            /tests/soil_moisture/run_sms_hosted_qualification.py
            /tests/soil_moisture/scan_http_fixture_server.py
            /tests/soil_moisture/test_scan_metered_http.R
            /tests/soil_moisture/test_scan_native_timeout.R
            /tests/soil_moisture/test_scan_nwcc_compat.R
      - name: Read the two historical job source trees
        shell: bash
        working-directory: historical
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4d8d1c4b34d48495e4cc068bebe9c3b80658683a
          git -c http.followRedirects=false fetch --no-tags --no-write-fetch-head --depth=1 --filter=blob:none https://github.com/dbo99/brim-live-data-feeds.git 7bcda89baa4d61698d0f0050166fdb0bbea052d3 6b9883b6acffac39eb92ac2a90b6fb90f54917a3
      - name: Run only the historical initial admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -IB reviewed/tests/soil_moisture/prove_scan_initial_admission.py
