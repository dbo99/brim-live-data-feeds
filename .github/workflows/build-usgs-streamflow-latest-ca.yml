name: Build USGS CA streamflow latest GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours. GitHub schedules are UTC and may not run exactly on the minute.
    - cron: "23 */4 * * *"

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: usgs-streamflow-v2
          packages: |
            any::dataRetrieval
            any::dplyr
            any::readr
            any::stringr
            any::lubridate
            any::jsonlite
            any::tibble
            any::purrr
            any::curl

      - name: Build isolated USGS streamflow candidate
        shell: Rscript {0}
        env:
          USGS_STREAMFLOW_HISTORY_MODE: none
          USGS_STREAMFLOW_MIN_LATEST_Q_TO_PUBLISH: "100"
          USGS_STREAMFLOW_ALLOW_DEGRADED_PUBLISH: "false"
          USGS_STREAMFLOW_GEOJSON: ${{ runner.temp }}/usgs-streamflow-candidate/candidate/docs/data/usgs_streamflow_latest_ca.geojson
          USGS_STREAMFLOW_SUMMARY_JSON: ${{ runner.temp }}/usgs-streamflow-candidate/candidate/docs/data/usgs_streamflow_latest_ca_summary.json
          # Optional: create this repository secret for higher USGS Water Data API rate limits.
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
        run: |
          source("scripts/build_usgs_streamflow_latest_ca.R")

      - name: Validate and describe USGS streamflow candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/usgs-streamflow-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/usgs_streamflow_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/usgs_streamflow_latest_ca_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id usgs-streamflow-latest-ca \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/usgs_streamflow_latest_ca.geojson \
            --allowlist docs/data/usgs_streamflow_latest_ca_summary.json

      - name: Upload validated USGS streamflow publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: usgs-streamflow-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usgs-streamflow-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated USGS streamflow publication candidate
        uses: actions/download-artifact@v8
        with:
          name: usgs-streamflow-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/usgs-streamflow-candidate

      - name: Reconcile and publish USGS streamflow candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/usgs-streamflow-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id usgs-streamflow-latest-ca \
            --target-ref refs/heads/main \
            --commit-subject "Update USGS CA streamflow latest feed" \
            --allowlist docs/data/usgs_streamflow_latest_ca.geojson \
            --allowlist docs/data/usgs_streamflow_latest_ca_summary.json \
            --candidate-validator scripts/usgs_streamflow_publisher.py \
            --reconcile-callback scripts/usgs_streamflow_publisher.py \
            --staged-validator scripts/usgs_streamflow_publisher.py
