name: Build NBM wind guidance latest

on:
  workflow_dispatch:
  schedule:
    # NBM QMD percentile guidance is produced for 00/06/12/18 UTC cycles and
    # commonly becomes available roughly six hours after cycle time. These
    # four runs occur after the expected QMD publication windows and avoid the
    # existing ASOS (:17), CDEC (:29), HRRR (:33), and GFS (:47) writers.
    - cron: "23 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Set up wgrib2
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: nbm-tools
          create-args: >-
            -c conda-forge
            wgrib2=3.8.*
          cache-environment: true
          init-shell: bash

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: nbm-wind-guidance-v1
          packages: |
            any::httr2
            any::jsonlite

      - name: Build NBM +6/+12/+24/+48 guidance feed
        shell: bash -el {0}
        env:
          BRIM_NBM_LOCAL_TZ: "America/Los_Angeles"
          BRIM_NBM_WEST: "-125.5"
          BRIM_NBM_EAST: "-112.0"
          BRIM_NBM_SOUTH: "31.0"
          BRIM_NBM_NORTH: "43.5"
          BRIM_NBM_RESOLUTION_DEGREES: "0.25"
          BRIM_NBM_TARGET_LEAD_HOURS: "6,12,24,48"
          BRIM_NBM_SUPPORT_WINDOW_HOURS: "6"
          BRIM_NBM_CYCLE_LOOKBACK_HOURS: "30"
          BRIM_NBM_RETAIN_HOURS: "18"
        run: |
          echo "wgrib2 path: $(command -v wgrib2)"
          wgrib2 -version || true
          Rscript scripts/build_nbm_wind_guidance_latest.R

      - name: Upload NBM QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nbm-wind-guidance-qa
          if-no-files-found: ignore
          retention-days: 14
          path: |
            qa/wind/nbm/NBM_wind_guidance_QA_upload.zip
            debug/wind/nbm/*.log

      - name: Commit updated NBM wind guidance feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            docs/data/wind/nbm_wind_guidance_feed_manifest.json \
            docs/data/wind/nbm_wind_guidance_latest_summary.json \
            docs/data/wind/nbm/guidance/
          if git diff --cached --quiet; then
            echo "No NBM wind-guidance changes to commit."
          else
            git commit -m "Update NBM wind guidance live feed"
            git pull --rebase origin main
            git push
          fi
