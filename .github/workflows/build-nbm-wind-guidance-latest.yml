name: Build NBM wind guidance latest

on:
  workflow_dispatch:
  schedule:
    # NBM QMD percentile guidance is produced for 00/06/12/18 UTC cycles and
    # commonly becomes available roughly six hours after cycle time. These
    # four runs occur after the expected QMD publication windows and avoid the
    # existing ASOS (:17), CDEC (:29), HRRR (:33), and GFS (:47) writers.
    - cron: "23 1,7,13,19 * * *"

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out selected branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Record candidate source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Set up wgrib2
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: nbm-tools
          create-args: >-
            -c conda-forge
            wgrib2=3.8.*
          cache-environment: true
          init-shell: bash

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: nbm-wind-guidance-v2
          packages: |
            any::httr2
            any::jsonlite
            any::maps

      - name: Seed isolated NBM wind build root
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/nbm-wind-build-root"
          mkdir -p "${build_root}/docs/data/wind/nbm"
          install -m 0644 docs/data/wind/nbm_wind_guidance_feed_manifest.json \
            "${build_root}/docs/data/wind/nbm_wind_guidance_feed_manifest.json"
          install -m 0644 docs/data/wind/nbm_wind_guidance_latest_summary.json \
            "${build_root}/docs/data/wind/nbm_wind_guidance_latest_summary.json"
          cp -R docs/data/wind/nbm/guidance \
            "${build_root}/docs/data/wind/nbm/guidance"

      - name: Build NBM +6/+12/+24/+48 guidance feed in isolation
        shell: bash -el {0}
        env:
          BRIM_NBM_PROJECT_ROOT: ${{ runner.temp }}/nbm-wind-build-root
          BRIM_NBM_LOCAL_TZ: "America/Los_Angeles"
          BRIM_NBM_WEST: "-125.5"
          BRIM_NBM_EAST: "-112.0"
          BRIM_NBM_SOUTH: "31.0"
          BRIM_NBM_NORTH: "43.5"
          BRIM_NBM_RESOLUTION_DEGREES: "0.25"
          BRIM_NBM_TARGET_LEAD_HOURS: "6,12,24,48"
          BRIM_NBM_SUPPORT_WINDOW_HOURS: "6"
          BRIM_NBM_CYCLE_LOOKBACK_HOURS: "30"
          BRIM_NBM_RETAIN_HOURS: "18"
          BRIM_NBM_COAST_BUFFER_CELLS: "1"
        run: |
          echo "wgrib2 path: $(command -v wgrib2)"
          wgrib2 -version || true
          Rscript scripts/build_nbm_wind_guidance_latest.R

      - name: Validate and describe NBM wind publication candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/nbm-wind-build-root"
          candidate_artifact_root="${RUNNER_TEMP}/nbm-wind-candidate"
          candidate_root="${candidate_artifact_root}/candidate"
          mkdir -p "${candidate_root}/docs/data/wind/nbm"
          install -m 0644 "${build_root}/docs/data/wind/nbm_wind_guidance_feed_manifest.json" \
            "${candidate_root}/docs/data/wind/nbm_wind_guidance_feed_manifest.json"
          install -m 0644 "${build_root}/docs/data/wind/nbm_wind_guidance_latest_summary.json" \
            "${candidate_root}/docs/data/wind/nbm_wind_guidance_latest_summary.json"
          cp -R "${build_root}/docs/data/wind/nbm/guidance" \
            "${candidate_root}/docs/data/wind/nbm/guidance"

          python3 scripts/nbm_wind_publisher.py validate --root "${candidate_root}"
          semantic_state="$(python3 scripts/nbm_wind_publisher.py semantic-key --root "${candidate_root}")"
          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id nbm-wind-guidance \
            --semantic-key-type nbm_wind_complete_cycle_state_sha256_v1 \
            --semantic-key "${semantic_state}" \
            --source-event-sha "${SOURCE_SHA}" \
            --allowlist docs/data/wind/nbm_wind_guidance_feed_manifest.json \
            --allowlist docs/data/wind/nbm_wind_guidance_latest_summary.json \
            --owned-root docs/data/wind/nbm/guidance

      - name: Upload validated NBM wind publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: nbm-wind-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nbm-wind-candidate
          if-no-files-found: error
          retention-days: 2

      - name: Upload NBM QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nbm-wind-guidance-qa
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/nbm-wind-build-root/qa/wind/nbm/NBM_wind_guidance_QA_upload.zip
            ${{ runner.temp }}/nbm-wind-build-root/debug/wind/nbm/*.log

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out candidate source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          fetch-depth: 0

      - name: Download validated NBM wind publication candidate
        uses: actions/download-artifact@v8
        with:
          name: nbm-wind-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nbm-wind-candidate

      - name: Reconcile and publish NBM wind candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
          CANDIDATE_SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
        run: |
          set -euo pipefail
          candidate_artifact_root="${RUNNER_TEMP}/nbm-wind-candidate"
          export GITHUB_SHA="${CANDIDATE_SOURCE_SHA}"
          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id nbm-wind-guidance \
            --target-ref refs/heads/main \
            --commit-subject "Update NBM wind guidance live feed" \
            --allowlist docs/data/wind/nbm_wind_guidance_feed_manifest.json \
            --allowlist docs/data/wind/nbm_wind_guidance_latest_summary.json \
            --owned-root docs/data/wind/nbm/guidance \
            --candidate-validator scripts/nbm_wind_publisher.py \
            --reconcile-callback scripts/nbm_wind_publisher.py \
            --staged-validator scripts/nbm_wind_publisher.py
