name: Build GFS wind latest

on:
  workflow_dispatch:
  schedule:
    # Hourly, away from :00 GitHub scheduled-workflow congestion and away from
    # the common BRIM feed minutes already in this repo. The script publishes a
    # sparse Current/+24-hour GFS time set and keeps only wind-specific files under
    # docs/data/wind/gfs/surface/.
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  # Shared with the other BRIM live-data writers so scheduled feed jobs do not
  # try to commit/push docs/data updates at the same time.
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: gfs-wind-v2
          packages: |
            any::httr2
            any::jsonlite
            any::terra

      - name: Build GFS wind time-set feed
        shell: Rscript {0}
        env:
          BRIM_RTW_BUILD_SANDBOX: "false"
          BRIM_RTW_BUILD_QA_ZIP: "true"
          BRIM_RTW_FORCE_REFRESH: "false"
          BRIM_RTW_LOCAL_TZ: "America/Los_Angeles"
          # Sparse support around Current and +24 hr. The wider edge fields
          # keep both buttons usable through several missed hourly dispatches.
          BRIM_RTW_TARGET_OFFSETS_HOURS: "-3,-2,-1,0,1,2,3,21,24,27,30"
          BRIM_RTW_MAX_FORECAST_HOUR: "42"
        run: |
          source("scripts/build_gfs_wind_latest.R")

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-wind-qa
          if-no-files-found: ignore
          path: |
            qa/wind/RTW_latest_QA_upload.zip
            debug/wind/*.log

      - name: Publish updated wind feed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the complete generated time set outside the checkout.
          # Rebase-merging generated JSON snapshots is both fragile and wrong;
          # instead, sync to current main and publish this run's full snapshot.
          publish_dir="${RUNNER_TEMP}/gfs-wind-publish"
          rm -rf "${publish_dir}"
          mkdir -p "${publish_dir}"
          cp docs/data/wind/gfs_surface_wind_latest.json "${publish_dir}/"
          cp docs/data/wind/gfs_surface_wind_latest_summary.json "${publish_dir}/"
          cp docs/data/wind/gfs_surface_wind_feed_manifest.json "${publish_dir}/"
          cp -a docs/data/wind/gfs/surface "${publish_dir}/surface"

          manifest_epoch() {
            python - "$1" <<'PY_EPOCH'
          import datetime as dt
          import json
          import sys
          from pathlib import Path
          
          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(0)
          
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          
          stamp = (
              data.get("generated_utc")
              or data.get("build_time_utc")
              or data.get("generated_at_utc")
          )
          if not stamp:
              raise SystemExit(0)
          
          try:
              value = dt.datetime.fromisoformat(
                  str(stamp).replace("Z", "+00:00")
              )
          except ValueError:
              raise SystemExit(0)
          
          if value.tzinfo is None:
              value = value.replace(tzinfo=dt.timezone.utc)
          print(int(value.timestamp()))
          PY_EPOCH
          }
          payload_epoch="$(manifest_epoch "${publish_dir}/gfs_surface_wind_feed_manifest.json")"

          for attempt in 1 2 3 4 5; do
            echo "GFS publish attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            remote_epoch="$(manifest_epoch docs/data/wind/gfs_surface_wind_feed_manifest.json)"
            if [[ -n "${payload_epoch}" && -n "${remote_epoch}" ]] && \
               (( remote_epoch >= payload_epoch )); then
              echo "Remote GFS feed is already as new or newer; skipping stale payload."
              exit 0
            fi

            cp "${publish_dir}/gfs_surface_wind_latest.json" \
              docs/data/wind/gfs_surface_wind_latest.json
            cp "${publish_dir}/gfs_surface_wind_latest_summary.json" \
              docs/data/wind/gfs_surface_wind_latest_summary.json
            cp "${publish_dir}/gfs_surface_wind_feed_manifest.json" \
              docs/data/wind/gfs_surface_wind_feed_manifest.json
            rm -rf docs/data/wind/gfs/surface
            mkdir -p docs/data/wind/gfs
            cp -a "${publish_dir}/surface" docs/data/wind/gfs/surface

            git add \
              docs/data/wind/gfs_surface_wind_latest.json \
              docs/data/wind/gfs_surface_wind_latest_summary.json \
              docs/data/wind/gfs_surface_wind_feed_manifest.json \
              docs/data/wind/gfs/surface/

            if git diff --cached --quiet; then
              echo "No GFS wind feed changes to commit."
              exit 0
            fi

            git commit -m "Update GFS wind time-set live feed"
            if git push origin HEAD:main; then
              echo "Published GFS wind feed."
              exit 0
            fi

            echo "Push raced with another repository update; retrying from current main."
            sleep $((attempt * 4))
          done

          echo "Could not publish GFS wind feed after 5 attempts." >&2
          exit 1
