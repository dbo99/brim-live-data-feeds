name: Build GFS wind latest

on:
  workflow_dispatch:
  schedule:
    # Retry-window after GFS 00/06/12/18Z cycles. GitHub schedules are UTC
    # and may not run exactly on the minute. Avoid :00 and existing BRIM feed
    # minutes; the script skips publish writes when the same GFS cycle is
    # already live, so the second attempt in each window should usually commit
    # nothing after a successful first attempt.
    - cron: "47 3,4,9,10,15,16,21,22 * * *"

permissions:
  contents: write

concurrency:
  # Shared with the other BRIM live-data writers so scheduled feed jobs do not
  # try to commit/push docs/data updates at the same time.
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: gfs-wind-v1
          packages: |
            any::httr2
            any::jsonlite
            any::terra

      - name: Build latest GFS wind feed
        shell: Rscript {0}
        env:
          BRIM_RTW_BUILD_SANDBOX: "false"
          BRIM_RTW_BUILD_QA_ZIP: "true"
          BRIM_RTW_SKIP_IF_SAME_PRODUCT: "true"
          BRIM_RTW_FORCE_REFRESH: "false"
          BRIM_RTW_LOCAL_TZ: "America/Los_Angeles"
        run: |
          source("scripts/build_gfs_wind_latest.R")

      - name: Upload QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfs-wind-qa
          if-no-files-found: ignore
          path: |
            qa/wind/RTW_latest_QA_upload.zip
            debug/wind/*.log

      - name: Commit updated wind feed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/wind/gfs_surface_wind_latest.json \
            docs/data/wind/gfs_surface_wind_latest_summary.json \
            docs/data/wind/gfs_surface_wind_feed_manifest.json
          if git diff --cached --quiet; then
            echo "No GFS wind feed changes to commit."
          else
            git commit -m "Update GFS wind live feed"
            git pull --rebase origin main
            git push
          fi
