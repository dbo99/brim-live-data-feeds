name: Build Winter Storm Levels

on:
  schedule:
    - cron: "8 2,8,14,20 * * *"
    - cron: "54 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated Winter Storm Levels bundle (main branch only)
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
      publish: ${{ steps.run-mode.outputs.publish }}
      build-started: ${{ steps.bundle.outputs.build_started }}

    steps:
      - name: Check out selected branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Record candidate source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve publication mode
        id: run-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail

          publish=false
          guard_preflight=false
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            publish=true
            guard_preflight=true
          elif [[ "${PUBLISH_INPUT}" == "true" && "${REF_NAME}" == "main" ]]; then
            publish=true
            guard_preflight=true
          fi
          if [[ "${PUBLISH_INPUT}" == "true" && "${REF_NAME}" != "main" ]]; then
            echo "Feature branches are dry-run only." >&2
          fi

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "guard_preflight=${guard_preflight}" >> "${GITHUB_OUTPUT}"
          echo "trigger_type=${EVENT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "output_root=${RUNNER_TEMP}/winter-storm-levels-bundle" >> "${GITHUB_OUTPUT}"
          echo "preflight_json=${RUNNER_TEMP}/winter-storm-levels-preflight.json" >> "${GITHUB_OUTPUT}"

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install lightweight preflight dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: winter-storm-levels-preflight-v1
          packages: |
            any::httr2
            any::jsonlite

      - name: Run preflight and workflow-safety tests
        shell: bash
        run: |
          set -euo pipefail
          Rscript tests/test_winter_storm_levels_preflight.R
          python3 tests/test_winter_storm_levels_workflow_safety.py

      - name: Run inventory-only cycle preflight
        id: preflight
        if: steps.run-mode.outputs.guard_preflight == 'true'
        shell: bash
        env:
          BRIM_WSL_PREFLIGHT_JSON: ${{ steps.run-mode.outputs.preflight_json }}
          BRIM_WSL_TRIGGER_TYPE: ${{ steps.run-mode.outputs.trigger_type }}
        run: |
          set -euo pipefail
          Rscript scripts/preflight_winter_storm_levels.R
          outcome="$(jq -er '.preflight_outcome' "${BRIM_WSL_PREFLIGHT_JSON}")"
          echo "outcome=${outcome}" >> "${GITHUB_OUTPUT}"
          echo "Preflight outcome: ${outcome}"

      - name: Stop on preflight source error
        if: steps.run-mode.outputs.guard_preflight == 'true' && steps.preflight.outputs.outcome == 'SOURCE_ERROR'
        shell: bash
        run: |
          echo "Unexpected Winter Storm Levels inventory/source failure." >&2
          exit 1

      - name: Install geospatial system libraries
        if: steps.run-mode.outputs.guard_preflight != 'true' || steps.preflight.outputs.outcome == 'NEW_CYCLE'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libssl-dev \
            libudunits2-dev

      - name: Install R package dependencies
        if: steps.run-mode.outputs.guard_preflight != 'true' || steps.preflight.outputs.outcome == 'NEW_CYCLE'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: winter-storm-levels-v1
          packages: |
            any::digest
            any::httr2
            any::isoband
            any::jsonlite
            any::sf
            any::terra

      - name: Run Winter Storm Levels unit tests
        if: steps.run-mode.outputs.guard_preflight != 'true' || steps.preflight.outputs.outcome == 'NEW_CYCLE'
        shell: bash
        run: |
          set -euo pipefail
          Rscript tests/test_winter_storm_levels.R

      - name: Build and validate Winter Storm Levels bundle
        id: bundle
        if: steps.run-mode.outputs.guard_preflight != 'true' || steps.preflight.outputs.outcome == 'NEW_CYCLE'
        shell: bash
        env:
          BRIM_WSL_PUBLISH: "false"
          BRIM_WSL_OUTPUT_ROOT: ${{ steps.run-mode.outputs.output_root }}
          BRIM_WSL_QA_JSON: ${{ runner.temp }}/winter-storm-levels-attempt.json
        run: |
          set -euo pipefail
          echo "build_started=true" >> "${GITHUB_OUTPUT}"
          if [[ -f "${{ steps.run-mode.outputs.preflight_json }}" ]]; then
            preflight_tmp="${{ steps.run-mode.outputs.preflight_json }}.tmp"
            jq '.build_started = true' "${{ steps.run-mode.outputs.preflight_json }}" > "${preflight_tmp}"
            mv "${preflight_tmp}" "${{ steps.run-mode.outputs.preflight_json }}"
          fi
          Rscript scripts/build_winter_storm_levels.R

      - name: Validate and describe Winter Storm Levels publication candidate
        id: publication-candidate
        if: steps.run-mode.outputs.publish == 'true' && steps.bundle.outcome == 'success' && steps.bundle.outputs.build_started == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          OUTPUT_ROOT: ${{ steps.run-mode.outputs.output_root }}
        run: |
          set -euo pipefail
          candidate_artifact_root="${RUNNER_TEMP}/winter-storm-levels-candidate"
          candidate_root="${candidate_artifact_root}/candidate"
          candidate_product_root="${candidate_root}/docs/data/winter-storm-levels"
          mkdir -p "${candidate_product_root}/nbm"
          install -m 0644 "${OUTPUT_ROOT}/winter_storm_levels_manifest.json" \
            "${candidate_product_root}/winter_storm_levels_manifest.json"
          cp -R "${OUTPUT_ROOT}/nbm/snow-level" \
            "${candidate_product_root}/nbm/snow-level"

          python3 scripts/winter_storm_levels_publisher.py validate --root "${candidate_root}"
          semantic_state="$(python3 scripts/winter_storm_levels_publisher.py semantic-key --root "${candidate_root}")"
          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id winter-storm-levels \
            --semantic-key-type winter_storm_two_cycle_state_sha256_v1 \
            --semantic-key "${semantic_state}" \
            --source-event-sha "${SOURCE_SHA}" \
            --allowlist docs/data/winter-storm-levels/winter_storm_levels_manifest.json \
            --owned-root docs/data/winter-storm-levels/nbm/snow-level

      - name: Upload validated Winter Storm Levels publication candidate
        if: steps.publication-candidate.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: winter-storm-levels-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winter-storm-levels-candidate
          if-no-files-found: error
          retention-days: 2

      - name: Prepare standalone browser QA artifact
        if: always() && steps.bundle.outputs.build_started == 'true'
        shell: bash
        env:
          OUTPUT_ROOT: ${{ steps.run-mode.outputs.output_root }}
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_ROOT}"
          cp qa/winter_storm_levels/index.html "${OUTPUT_ROOT}/qa.html"

      - name: Upload dry-run bundle and diagnostics
        id: upload-bundle
        if: always() && steps.bundle.outputs.build_started == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winter-storm-levels-qa
          path: |
            ${{ steps.run-mode.outputs.output_root }}/
            ${{ runner.temp }}/winter-storm-levels-attempt.json
            ${{ steps.run-mode.outputs.preflight_json }}
            docs/data/winter-storm-levels/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload guarded no-op diagnostics
        if: always() && steps.run-mode.outputs.guard_preflight == 'true' && steps.bundle.outputs.build_started != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: winter-storm-levels-qa
          path: ${{ steps.run-mode.outputs.preflight_json }}
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        env:
          BUILD_STARTED: ${{ steps.bundle.outputs.build_started || 'false' }}
          PREFLIGHT_JSON: ${{ steps.run-mode.outputs.preflight_json }}
          PUBLICATION_CANDIDATE_PREPARED: ${{ steps.publication-candidate.outcome == 'success' }}
          QA_JSON: ${{ runner.temp }}/winter-storm-levels-attempt.json
        run: |
          set -euo pipefail
          {
            echo "## Winter Storm Levels"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            if [[ -f "${PREFLIGHT_JSON}" ]]; then
              preflight_tmp="${PREFLIGHT_JSON}.tmp"
              jq --argjson build_started "${BUILD_STARTED}" \
                 '.build_started = $build_started | .publication_attempted = false' \
                 "${PREFLIGHT_JSON}" > "${preflight_tmp}"
              mv "${preflight_tmp}" "${PREFLIGHT_JSON}"
              jq -r '"| Trigger | `\(.trigger_type)` |", "| Observation time | `\(.observation_time_utc)` |", "| Canonical cycle | `\(.canonical_current_cycle // "none")` |", "| Candidate cycles | `\(.candidate_cycles | join(", "))` |", "| Newest complete cycle | `\(.newest_complete_cycle // "none")` |", "| Preflight outcome | `\(.preflight_outcome)` |", "| Build started | `\(.build_started)` |"' "${PREFLIGHT_JSON}"
            else
              echo "| Preflight | `not_required_for_manual_dry_run` |"
              echo "| Build started | `${BUILD_STARTED}` |"
            fi
            echo "| Publication candidate prepared | `${PUBLICATION_CANDIDATE_PREPARED}` |"
            if [[ -f "${QA_JSON}" ]]; then
              jq -r '"| Status | `\(.status)` |", "| Mode | `\(.mode)` |", "| Selected cycle | `\(.selected_cycle_time_utc // "none")` |", "| Valid-time coverage | `\(.valid_time_start_utc // "none")` through `\(.valid_time_end_utc // "none")` |", "| Current-cycle targets | \(.current_cycle_target_count // 0) / \(.expected_current_cycle_target_count // 0) |", "| Source / vector bytes | \(.total_source_bytes // 0) / \(.total_output_bytes // 0) |", "| Runtime | \(.elapsed_seconds // "n/a") seconds |", "| QA | `\(.qa // "not_run")` |", "| Semantic change | \(.semantic_change) |", "| Producer output | `\(.publication_outcome // "not_published")` |"' "${QA_JSON}"
            else
              echo "| Producer attempt | `not_started` |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-to-main:
    if: ${{ needs.prepare-candidate.outputs.publish == 'true' && needs.prepare-candidate.outputs.build-started == 'true' && github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out candidate source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          fetch-depth: 0

      - name: Download validated Winter Storm Levels publication candidate
        uses: actions/download-artifact@v8
        with:
          name: winter-storm-levels-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/winter-storm-levels-candidate

      - name: Reconcile and publish Winter Storm Levels candidate onto current main
        id: publish
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
          CANDIDATE_SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
        run: |
          set -euo pipefail
          candidate_artifact_root="${RUNNER_TEMP}/winter-storm-levels-candidate"
          export GITHUB_SHA="${CANDIDATE_SOURCE_SHA}"
          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id winter-storm-levels \
            --target-ref refs/heads/main \
            --commit-subject "Update Winter Storm Levels feed" \
            --allowlist docs/data/winter-storm-levels/winter_storm_levels_manifest.json \
            --owned-root docs/data/winter-storm-levels/nbm/snow-level \
            --candidate-validator scripts/winter_storm_levels_publisher.py \
            --reconcile-callback scripts/winter_storm_levels_publisher.py \
            --staged-validator scripts/winter_storm_levels_publisher.py

      - name: Write publication summary
        if: always()
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## Winter Storm Levels publication"
            echo
            echo "Shared main publisher outcome: \`${PUBLISH_OUTCOME}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
