name: Build CoCoRaHS daily precip GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Every 8 hours. GitHub schedules are UTC and may not run exactly on the minute.
    # 16:37 UTC is roughly morning California time, when many daily reports are available.
    - cron: "37 0,8,16 * * *"

permissions:
  contents: write

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("curl", "jsonlite", "lubridate", "tibble", "dplyr", "purrr", "readr"),
            repos = "https://cloud.r-project.org"
          )

      - name: Build latest CoCoRaHS daily precip GeoJSON
        shell: Rscript {0}
        run: |
          source("scripts/build_cocorahs_daily_precip_latest.R")

      - name: Commit updated feed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || \
                "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "Refusing to publish from non-branch ref: ${GITHUB_REF}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/cocorahs_daily_precip_ca_latest.geojson \
            docs/data/cocorahs_daily_precip_ca_latest_summary.json \
            docs/data/cocorahs_daily_precip_conus_latest.geojson \
            docs/data/cocorahs_daily_precip_conus_latest_summary.json

          if git diff --cached --quiet; then
            echo "No CoCoRaHS feed changes to commit."
            exit 0
          fi

          git commit -m "Update CoCoRaHS daily precip feed"

          if ! git push origin "HEAD:${GITHUB_REF}"; then
            echo "The selected branch advanced unexpectedly; nothing was published." >&2
            echo "Rerun this workflow from the latest branch tip." >&2
            exit 1
          fi
