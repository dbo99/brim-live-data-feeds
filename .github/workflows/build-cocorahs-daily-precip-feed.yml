name: Build CoCoRaHS daily precip GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Every 8 hours. GitHub schedules are UTC and may not run exactly on the minute.
    # 16:37 UTC is roughly morning California time, when many daily reports are available.
    - cron: "37 0,8,16 * * *"

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(
            c("curl", "jsonlite", "lubridate", "tibble", "dplyr", "purrr", "readr"),
            repos = "https://cloud.r-project.org"
          )

      - name: Build isolated CoCoRaHS candidate
        shell: Rscript {0}
        env:
          COCORAHS_CA_DAILY_PRECIP_GEOJSON: ${{ runner.temp }}/cocorahs-candidate/candidate/docs/data/cocorahs_daily_precip_ca_latest.geojson
          COCORAHS_CA_DAILY_PRECIP_SUMMARY_JSON: ${{ runner.temp }}/cocorahs-candidate/candidate/docs/data/cocorahs_daily_precip_ca_latest_summary.json
          COCORAHS_CONUS_DAILY_PRECIP_GEOJSON: ${{ runner.temp }}/cocorahs-candidate/candidate/docs/data/cocorahs_daily_precip_conus_latest.geojson
          COCORAHS_CONUS_DAILY_PRECIP_SUMMARY_JSON: ${{ runner.temp }}/cocorahs-candidate/candidate/docs/data/cocorahs_daily_precip_conus_latest_summary.json
        run: |
          source("scripts/build_cocorahs_daily_precip_latest.R")

      - name: Validate and describe CoCoRaHS candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cocorahs-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/cocorahs_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/cocorahs_daily_precip_conus_latest_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cocorahs-daily-precip \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/cocorahs_daily_precip_ca_latest.geojson \
            --allowlist docs/data/cocorahs_daily_precip_ca_latest_summary.json \
            --allowlist docs/data/cocorahs_daily_precip_conus_latest.geojson \
            --allowlist docs/data/cocorahs_daily_precip_conus_latest_summary.json

      - name: Upload validated CoCoRaHS publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: cocorahs-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cocorahs-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated CoCoRaHS publication candidate
        uses: actions/download-artifact@v8
        with:
          name: cocorahs-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cocorahs-candidate

      - name: Reconcile and publish CoCoRaHS candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cocorahs-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cocorahs-daily-precip \
            --target-ref refs/heads/main \
            --commit-subject "Update CoCoRaHS daily precip feed" \
            --allowlist docs/data/cocorahs_daily_precip_ca_latest.geojson \
            --allowlist docs/data/cocorahs_daily_precip_ca_latest_summary.json \
            --allowlist docs/data/cocorahs_daily_precip_conus_latest.geojson \
            --allowlist docs/data/cocorahs_daily_precip_conus_latest_summary.json \
            --candidate-validator scripts/cocorahs_publisher.py \
            --reconcile-callback scripts/cocorahs_publisher.py \
            --staged-validator scripts/cocorahs_publisher.py
