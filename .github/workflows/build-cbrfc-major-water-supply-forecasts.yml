name: Build CBRFC major water-supply forecasts

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated CBRFC feed (main branch only)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "14 8 * * *"
      timezone: "America/Los_Angeles"

permissions: {}

concurrency:
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.run-mode.outputs.publish }}
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out selected branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Record candidate source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve publication mode
        id: run-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail

          publish=false
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            if [[ "${REF_NAME}" != "main" ]]; then
              echo "Scheduled publication is restricted to main." >&2
              exit 1
            fi
            publish=true
          elif [[ "${PUBLISH_INPUT}" == "true" && "${REF_NAME}" == "main" ]]; then
            publish=true
          fi

          candidate_artifact_root="${RUNNER_TEMP}/cbrfc-forecast-candidate"
          output_path="${candidate_artifact_root}/candidate/docs/data/cbrfc_major_water_supply_forecasts.json"

          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          echo "output_path=${output_path}" >> "${GITHUB_OUTPUT}"
          echo "Publication enabled: ${publish}"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libxml2-dev \
            libssl-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: cbrfc-major-water-supply-v1
          packages: |
            any::curl
            any::digest
            any::jsonlite
            any::xml2

      - name: Seed isolated CBRFC candidate path
        shell: bash
        env:
          OUTPUT_PATH: ${{ steps.run-mode.outputs.output_path }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${OUTPUT_PATH}")"
          if [[ -f docs/data/cbrfc_major_water_supply_forecasts.json ]]; then
            install -m 0644 \
              docs/data/cbrfc_major_water_supply_forecasts.json \
              "${OUTPUT_PATH}"
          fi

      - name: Build and validate isolated CBRFC candidate
        shell: Rscript {0}
        env:
          CBRFC_FORECAST_OUTPUT_JSON: ${{ steps.run-mode.outputs.output_path }}
          CBRFC_FORECAST_PRIOR_JSON: docs/data/cbrfc_major_water_supply_forecasts.json
          CBRFC_FORECAST_QA_JSON: ${{ runner.temp }}/cbrfc_major_water_supply_forecasts_run.json
          CBRFC_FORECAST_STALE_AFTER_DAYS: "40"
          CBRFC_FORECAST_WATER_YEAR_STALE_AFTER_DAYS: "40"
          CBRFC_FORECAST_LOCAL_MONTHLY_STALE_AFTER_DAYS: "40"
        run: |
          source("scripts/build_cbrfc_major_water_supply_forecasts.R")

      - name: Validate and describe CBRFC candidate artifact
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cbrfc-forecast-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/cbrfc_forecast_publisher.py validate \
            --root "${candidate_root}"
          semantic_state="$(python3 scripts/cbrfc_forecast_publisher.py semantic-key \
            --root "${candidate_root}")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cbrfc-major-water-supply-forecasts \
            --semantic-key-type cbrfc_record_state_sha256_v1 \
            --semantic-key "${semantic_state}" \
            --source-event-sha "${SOURCE_SHA}" \
            --allowlist docs/data/cbrfc_major_water_supply_forecasts.json

      - name: Upload validated CBRFC publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: cbrfc-forecast-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cbrfc-forecast-candidate
          if-no-files-found: error
          retention-days: 2

      - name: Upload CBRFC run diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cbrfc-major-water-supply-forecasts-qa
          path: ${{ runner.temp }}/cbrfc_major_water_supply_forecasts_run.json
          if-no-files-found: warn
          retention-days: 14

  publish-to-main:
    if: ${{ needs.prepare-candidate.outputs.publish == 'true' && github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out candidate source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          fetch-depth: 0

      - name: Download validated CBRFC publication candidate
        uses: actions/download-artifact@v8
        with:
          name: cbrfc-forecast-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cbrfc-forecast-candidate

      - name: Reconcile and publish CBRFC candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
          CANDIDATE_SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cbrfc-forecast-candidate"
          export GITHUB_SHA="${CANDIDATE_SOURCE_SHA}"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cbrfc-major-water-supply-forecasts \
            --target-ref refs/heads/main \
            --commit-subject "Update CBRFC major water-supply forecast feed" \
            --allowlist docs/data/cbrfc_major_water_supply_forecasts.json \
            --candidate-validator scripts/cbrfc_forecast_publisher.py \
            --reconcile-callback scripts/cbrfc_forecast_publisher.py \
            --staged-validator scripts/cbrfc_forecast_publisher.py
