name: Build snow pillow SWE latest feed

on:
  workflow_dispatch:
  schedule:
    # Every 8 hours. UTC schedule; GitHub may not run exactly on the minute.
    # Approx. 10:52 PM, 6:52 AM, and 2:52 PM PDT during daylight time.
    - cron: "52 5,13,21 * * *"

permissions: {}

concurrency:
  # Retain the established whole-workflow writer lock during the migration.
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: snow-pillow-latest-v4
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::stringr
            any::lubridate
            any::jsonlite
            any::curl
            any::tibble
            any::purrr
            any::sharpshootR

      - name: Prepare isolated Snow Pillow build root
        shell: bash
        run: |
          set -euo pipefail

          build_root="${RUNNER_TEMP}/snow-pillow-build-root"
          mkdir -p \
            "${build_root}/scripts" \
            "${build_root}/data/input" \
            "${build_root}/docs/data"

          install -m 0644 \
            scripts/snow_pillow_partial_refresh_helpers.R \
            "${build_root}/scripts/snow_pillow_partial_refresh_helpers.R"
          install -m 0644 \
            data/input/snow_pillow_station_index.csv \
            "${build_root}/data/input/snow_pillow_station_index.csv"
          install -m 0644 \
            data/input/snow_pillow_swe_normal_medians.csv \
            "${build_root}/data/input/snow_pillow_swe_normal_medians.csv"

          # The unchanged R producer may use these event-checkout files for its
          # local partial-refresh construction. The PUBLISH callback records
          # that status and replaces every carried provider from fresh main.
          install -m 0644 \
            docs/data/snow_pillow_latest.geojson \
            "${build_root}/docs/data/snow_pillow_latest.geojson"
          install -m 0644 \
            docs/data/snow_pillow_latest_summary.json \
            "${build_root}/docs/data/snow_pillow_latest_summary.json"
          install -m 0644 \
            docs/data/snow_pillow_current_wy_trace.csv \
            "${build_root}/docs/data/snow_pillow_current_wy_trace.csv"
          install -m 0644 \
            docs/data/snow_pillow_current_wy_trace_summary.json \
            "${build_root}/docs/data/snow_pillow_current_wy_trace_summary.json"

      - name: Build isolated Snow Pillow candidate
        shell: Rscript {0}
        env:
          SNOW_PILLOW_BUILD_ROOT: ${{ runner.temp }}/snow-pillow-build-root
        run: |
          setwd(Sys.getenv("SNOW_PILLOW_BUILD_ROOT"))
          source(file.path(
            Sys.getenv("GITHUB_WORKSPACE"),
            "scripts",
            "build_snow_pillow_latest.R"
          ))

      - name: Validate and describe Snow Pillow candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          build_root="${RUNNER_TEMP}/snow-pillow-build-root"
          candidate_artifact_root="${RUNNER_TEMP}/snow-pillow-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/snow_pillow_publisher.py validate \
            --root "${build_root}"

          mkdir -p "${candidate_root}/docs/data"
          install -m 0644 \
            "${build_root}/docs/data/snow_pillow_latest.geojson" \
            "${candidate_root}/docs/data/snow_pillow_latest.geojson"
          install -m 0644 \
            "${build_root}/docs/data/snow_pillow_latest_summary.json" \
            "${candidate_root}/docs/data/snow_pillow_latest_summary.json"
          install -m 0644 \
            "${build_root}/docs/data/snow_pillow_current_wy_trace.csv" \
            "${candidate_root}/docs/data/snow_pillow_current_wy_trace.csv"
          install -m 0644 \
            "${build_root}/docs/data/snow_pillow_current_wy_trace_summary.json" \
            "${candidate_root}/docs/data/snow_pillow_current_wy_trace_summary.json"

          python3 scripts/snow_pillow_publisher.py validate \
            --root "${candidate_root}"
          semantic_state="$(python3 scripts/snow_pillow_publisher.py semantic-key \
            --root "${candidate_root}")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id snow-pillow-latest \
            --semantic-key-type snow_provider_state_v1 \
            --semantic-key "${semantic_state}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/snow_pillow_latest.geojson \
            --allowlist docs/data/snow_pillow_latest_summary.json \
            --allowlist docs/data/snow_pillow_current_wy_trace.csv \
            --allowlist docs/data/snow_pillow_current_wy_trace_summary.json

      - name: Upload validated Snow Pillow publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: snow-pillow-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snow-pillow-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated Snow Pillow publication candidate
        uses: actions/download-artifact@v8
        with:
          name: snow-pillow-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snow-pillow-candidate

      - name: Reconcile and publish Snow Pillow candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/snow-pillow-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id snow-pillow-latest \
            --target-ref refs/heads/main \
            --commit-subject "Update snow pillow SWE latest feed" \
            --allowlist docs/data/snow_pillow_latest.geojson \
            --allowlist docs/data/snow_pillow_latest_summary.json \
            --allowlist docs/data/snow_pillow_current_wy_trace.csv \
            --allowlist docs/data/snow_pillow_current_wy_trace_summary.json \
            --candidate-validator scripts/snow_pillow_publisher.py \
            --reconcile-callback scripts/snow_pillow_publisher.py \
            --staged-validator scripts/snow_pillow_publisher.py
