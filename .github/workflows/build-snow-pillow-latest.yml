name: Build snow pillow SWE latest feed

on:
  workflow_dispatch:
  schedule:
    # Every 8 hours. UTC schedule; GitHub may not run exactly on the minute.
    # Approx. 10:52 PM, 6:52 AM, and 2:52 PM PDT during daylight time.
    - cron: "52 5,13,21 * * *"

permissions:
  contents: write

concurrency:
  # Shared with the other BRIM live-data workflows so multiple scheduled feeds
  # do not try to commit/push docs/data updates at the same time.
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: snow-pillow-latest-v4
          packages: |
            any::dplyr
            any::readr
            any::tidyr
            any::stringr
            any::lubridate
            any::jsonlite
            any::curl
            any::tibble
            any::purrr
            any::sharpshootR

      - name: Build latest snow pillow SWE feed
        shell: Rscript {0}
        run: |
          source("scripts/build_snow_pillow_latest.R")

      - name: Commit updated feed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "branch" || \
                "${GITHUB_REF}" != refs/heads/* ]]; then
            echo "Refusing to publish from non-branch ref: ${GITHUB_REF}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/data/snow_pillow_latest.geojson \
            docs/data/snow_pillow_latest_summary.json \
            docs/data/snow_pillow_current_wy_trace.csv \
            docs/data/snow_pillow_current_wy_trace_summary.json

          if git diff --cached --quiet; then
            echo "No snow pillow SWE latest-feed changes to commit."
            exit 0
          fi

          git commit -m "Update snow pillow SWE latest feed"

          if ! git push origin "HEAD:${GITHUB_REF}"; then
            echo "The selected branch advanced unexpectedly; nothing was published." >&2
            echo "Rerun this workflow from the latest branch tip." >&2
            exit 1
          fi
