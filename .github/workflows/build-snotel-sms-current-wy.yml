name: Build SNOTEL soil moisture current-WY feed

on:
  workflow_dispatch:
    inputs:
      acquire:
        description: Separately approved real acquisition
        type: boolean
        default: false
      publish:
        description: Separately approved main publication
        type: boolean
        default: false
      bootstrap:
        description: Explicit absence of a prior public product
        type: boolean
        default: false
      window_end:
        description: Approved absolute UTC acquisition-window end (Z)
        type: string
        required: false

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      candidate_ready: ${{ steps.prepare.outputs.candidate_ready }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - name: Validate explicit modes
        env:
          ACQUIRE: ${{ inputs.acquire }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == true && "$ACQUIRE" != true ]]; then
            echo "Publication requires explicit acquisition"; exit 2
          fi
          if [[ "$ACQUIRE" == true && "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "A rerun cannot replace spent or missing source-attempt state"; exit 2
          fi
          if [[ "$ACQUIRE" != true ]]; then echo "DISABLED: zero source requests"; fi

      - name: Check out exact source event
        if: ${{ inputs.acquire }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qualify this runner offline before provider admission
        if: ${{ inputs.acquire }}
        shell: bash
        env:
          CATALOG_PIN: ${{ vars.SNOTEL_SMS_PUBLIC_CATALOG_SHA256 }}
          ROSTER_PIN: ${{ vars.SNOTEL_SMS_PUBLIC_ROSTER_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test "$(python3 -c 'import sys; print(sys.version_info >= (3,12))')" = True
          timeout --signal=KILL 180s sudo unshare --net -- \
            runuser -u "$(id -un)" -- env -i PATH="$PATH" TMPDIR="$RUNNER_TEMP" \
            PYTHONDONTWRITEBYTECODE=1 \
            python3 -B tests/soil_moisture/test_snotel_origin.py \
            > "$RUNNER_TEMP/snotel-offline-qualification.log" 2>&1
          echo 'SNOTEL_FOCUSED_ORIGIN_QUALIFICATION_PASS'
          # Actual event checkout and Git objects, not an injected Git fixture.
          timeout --signal=KILL 120s sudo unshare --net -- \
            runuser -u "$(id -un)" -- env -i PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" CATALOG_PIN="$CATALOG_PIN" \
            ROSTER_PIN="$ROSTER_PIN" PYTHONDONTWRITEBYTECODE=1 \
            python3 -B scripts/snotel_first_run.py check-source

      - name: Prepare complete bounded current-WY candidate
        id: prepare
        if: ${{ inputs.acquire }}
        shell: bash
        env:
          ACQUIRE: ${{ inputs.acquire }}
          R9_GRANT_EXACT_MATCH: >-
            ${{ vars.SNOTEL_SMS_FIRST_RUN_JSON == format('{{"activated_at_utc":"{0}","approval_id":"L11-SNOTEL-SMS-R9-HOSTED-ORIGIN-AND-FIRST-PRODUCT-20261112","catalog_sha256":"{1}","limits":{{"attempts":32,"finalization_seconds":120,"station_bytes":1048576,"station_seconds":60,"total_bytes":33554432,"total_seconds":1920}},"roster_sha256":"{2}","run_number":2,"source_sha":"{3}","version":"snotel-first-run-1","window_end":"{4}"}}', fromJSON(vars.SNOTEL_SMS_FIRST_RUN_JSON).activated_at_utc, vars.SNOTEL_SMS_PUBLIC_CATALOG_SHA256, vars.SNOTEL_SMS_PUBLIC_ROSTER_SHA256, github.sha, inputs.window_end) }}
          GRANT_ACTIVATED_AT: ${{ fromJSON(vars.SNOTEL_SMS_FIRST_RUN_JSON).activated_at_utc }}
          PUBLISH: ${{ inputs.publish }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          WINDOW_END: ${{ inputs.window_end }}
          CATALOG_PIN: ${{ vars.SNOTEL_SMS_PUBLIC_CATALOG_SHA256 }}
          ROSTER_PIN: ${{ vars.SNOTEL_SMS_PUBLIC_ROSTER_SHA256 }}
          RELEASE_APPROVED: ${{ vars.SNOTEL_SMS_PUBLIC_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          source_sha="$(git --no-optional-locks rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          test "$RELEASE_APPROVED" = true
          python3 -B scripts/snotel_first_run.py prepare

      - name: Upload only the validated public candidate
        if: ${{ steps.prepare.outputs.candidate_ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: snotel-current-wy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/snotel-private/run/transfer/candidate/docs/data/snotel-sms/index.json
            ${{ runner.temp }}/snotel-private/run/transfer/candidate/docs/data/snotel-sms/current-wy.json
            ${{ runner.temp }}/snotel-private/run/transfer/candidate-metadata.json
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    needs: prepare-candidate
    if: ${{ inputs.acquire && inputs.publish && github.ref == 'refs/heads/main' && needs.prepare-candidate.outputs.candidate_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out candidate source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download closed candidate
        uses: actions/download-artifact@v8
        with:
          name: snotel-current-wy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snotel-transfer

      - name: Publish through the unchanged shared owner
        env:
          R9_GRANT_EXACT_MATCH: >-
            ${{ vars.SNOTEL_SMS_FIRST_RUN_JSON == format('{{"activated_at_utc":"{0}","approval_id":"L11-SNOTEL-SMS-R9-HOSTED-ORIGIN-AND-FIRST-PRODUCT-20261112","catalog_sha256":"{1}","limits":{{"attempts":32,"finalization_seconds":120,"station_bytes":1048576,"station_seconds":60,"total_bytes":33554432,"total_seconds":1920}},"roster_sha256":"{2}","run_number":2,"source_sha":"{3}","version":"snotel-first-run-1","window_end":"{4}"}}', fromJSON(vars.SNOTEL_SMS_FIRST_RUN_JSON).activated_at_utc, vars.SNOTEL_SMS_PUBLIC_CATALOG_SHA256, vars.SNOTEL_SMS_PUBLIC_ROSTER_SHA256, github.sha, inputs.window_end) }}
          GRANT_ACTIVATED_AT: ${{ fromJSON(vars.SNOTEL_SMS_FIRST_RUN_JSON).activated_at_utc }}
          WINDOW_END: ${{ inputs.window_end }}
          BRIM_LIVE_MAIN_PUBLISH: "true"
          SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source_sha }}
          CATALOG_PIN: ${{ vars.SNOTEL_SMS_PUBLIC_CATALOG_SHA256 }}
          ROSTER_PIN: ${{ vars.SNOTEL_SMS_PUBLIC_ROSTER_SHA256 }}
          RELEASE_APPROVED: ${{ vars.SNOTEL_SMS_PUBLIC_RELEASE_APPROVED }}
        run: |
          set -euo pipefail
          test "$(git --no-optional-locks rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$RELEASE_APPROVED" = true
          python3 -B scripts/snotel_first_run.py publish
          python3 -B scripts/soil_network_workflow.py snotel-publish \
            --repo . --transfer "$RUNNER_TEMP/snotel-transfer" \
            --catalog-sha256 "$CATALOG_PIN" --roster-sha256 "$ROSTER_PIN"

      - name: Authenticate committed delivery independently
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          delivered_commit="$(git --no-optional-locks rev-parse FETCH_HEAD)"
          python3 -B scripts/soil_network_workflow.py snotel-acknowledge \
            --repo . --commit "$delivered_commit" \
            --candidate "$RUNNER_TEMP/snotel-transfer/candidate"
