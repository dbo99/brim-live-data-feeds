name: Build HRRR wind latest

on:
  workflow_dispatch:
  schedule:
    # Hourly at :33 UTC, between ASOS at :17 and GFS at :47. GitHub schedules
    # are best-effort and can start late; one run publishes Current, +6 hr, and
    # +12 hr targets into the same rolling manifest.
    - cron: "33 * * * *"

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out selected branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
          fetch-depth: 0

      - name: Record candidate source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Set up wgrib2
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: hrrr-tools
          create-args: >-
            -c conda-forge
            wgrib2=3.8.*
          cache-environment: true
          init-shell: bash

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: hrrr-wind-production-v1
          packages: |
            any::httr2
            any::jsonlite
            any::terra

      - name: Seed isolated HRRR build root
        shell: bash
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/hrrr-wind-build-root"
          mkdir -p "${build_root}/docs/data/wind/hrrr"
          install -m 0644 docs/data/wind/hrrr_surface_wind_latest.json \
            "${build_root}/docs/data/wind/hrrr_surface_wind_latest.json"
          install -m 0644 docs/data/wind/hrrr_surface_wind_latest_summary.json \
            "${build_root}/docs/data/wind/hrrr_surface_wind_latest_summary.json"
          install -m 0644 docs/data/wind/hrrr_surface_wind_feed_manifest.json \
            "${build_root}/docs/data/wind/hrrr_surface_wind_feed_manifest.json"
          cp -R docs/data/wind/hrrr/surface \
            "${build_root}/docs/data/wind/hrrr/surface"

      - name: Build HRRR Current/+6/+12 time-set feed in isolation
        shell: bash -el {0}
        env:
          BRIM_HRRR_PROJECT_ROOT: ${{ runner.temp }}/hrrr-wind-build-root
          BRIM_HRRR_LOCAL_TZ: "America/Los_Angeles"
          BRIM_HRRR_FORCE_REFRESH: "false"
          BRIM_HRRR_WEST: "-125.5"
          BRIM_HRRR_EAST: "-112.0"
          BRIM_HRRR_SOUTH: "31.0"
          BRIM_HRRR_NORTH: "43.5"
          BRIM_HRRR_RESOLUTION_DEGREES: "0.05"
          BRIM_HRRR_CYCLE_LOOKBACK_HOURS: "8"
          BRIM_HRRR_TARGET_LEAD_HOURS: "0,6,12"
          BRIM_HRRR_MAX_FORECAST_HOUR: "18"
          BRIM_HRRR_RETAIN_PAST_HOURS: "4"
          BRIM_HRRR_RETAIN_FUTURE_HOURS: "14"
          BRIM_HRRR_MAX_MANIFEST_ENTRIES: "24"
        run: |
          echo "wgrib2 path: $(command -v wgrib2)"
          wgrib2 -version || true
          Rscript scripts/build_hrrr_wind_latest.R

      - name: Validate and describe HRRR publication candidate
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          build_root="${RUNNER_TEMP}/hrrr-wind-build-root"
          candidate_artifact_root="${RUNNER_TEMP}/hrrr-wind-candidate"
          candidate_root="${candidate_artifact_root}/candidate"
          mkdir -p "${candidate_root}/docs/data/wind/hrrr"
          install -m 0644 "${build_root}/docs/data/wind/hrrr_surface_wind_latest.json" \
            "${candidate_root}/docs/data/wind/hrrr_surface_wind_latest.json"
          install -m 0644 "${build_root}/docs/data/wind/hrrr_surface_wind_latest_summary.json" \
            "${candidate_root}/docs/data/wind/hrrr_surface_wind_latest_summary.json"
          install -m 0644 "${build_root}/docs/data/wind/hrrr_surface_wind_feed_manifest.json" \
            "${candidate_root}/docs/data/wind/hrrr_surface_wind_feed_manifest.json"
          cp -R "${build_root}/docs/data/wind/hrrr/surface" \
            "${candidate_root}/docs/data/wind/hrrr/surface"

          python3 scripts/hrrr_wind_publisher.py validate --root "${candidate_root}"
          semantic_state="$(python3 scripts/hrrr_wind_publisher.py semantic-key --root "${candidate_root}")"
          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id hrrr-wind-latest \
            --semantic-key-type hrrr_rolling_state_sha256_v1 \
            --semantic-key "${semantic_state}" \
            --source-event-sha "${SOURCE_SHA}" \
            --allowlist docs/data/wind/hrrr_surface_wind_latest.json \
            --allowlist docs/data/wind/hrrr_surface_wind_latest_summary.json \
            --allowlist docs/data/wind/hrrr_surface_wind_feed_manifest.json \
            --owned-root docs/data/wind/hrrr/surface

      - name: Upload validated HRRR publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: hrrr-wind-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hrrr-wind-candidate
          if-no-files-found: error
          retention-days: 2

      - name: Upload HRRR QA artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hrrr-wind-qa
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/hrrr-wind-build-root/qa/wind/hrrr/HRRR_latest_QA_upload.zip
            ${{ runner.temp }}/hrrr-wind-build-root/debug/wind/hrrr/*.log

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out candidate source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-candidate.outputs.source-sha }}
          fetch-depth: 0

      - name: Download validated HRRR publication candidate
        uses: actions/download-artifact@v8
        with:
          name: hrrr-wind-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hrrr-wind-candidate

      - name: Reconcile and publish HRRR candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
          CANDIDATE_SOURCE_SHA: ${{ needs.prepare-candidate.outputs.source-sha }}
        run: |
          set -euo pipefail
          candidate_artifact_root="${RUNNER_TEMP}/hrrr-wind-candidate"
          export GITHUB_SHA="${CANDIDATE_SOURCE_SHA}"
          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id hrrr-wind-latest \
            --target-ref refs/heads/main \
            --commit-subject "Update HRRR wind rolling live feed" \
            --allowlist docs/data/wind/hrrr_surface_wind_latest.json \
            --allowlist docs/data/wind/hrrr_surface_wind_latest_summary.json \
            --allowlist docs/data/wind/hrrr_surface_wind_feed_manifest.json \
            --owned-root docs/data/wind/hrrr/surface \
            --candidate-validator scripts/hrrr_wind_publisher.py \
            --reconcile-callback scripts/hrrr_wind_publisher.py \
            --staged-validator scripts/hrrr_wind_publisher.py
