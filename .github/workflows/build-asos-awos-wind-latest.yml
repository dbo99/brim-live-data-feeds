name: Build ASOS/METAR observed wind latest

on:
  workflow_dispatch:
  schedule:
    # Primary hourly refresh at hh:17 UTC plus a backup opportunity at hh:42.
    # A freshness guard below skips the backup when the primary run published
    # successfully within the previous 45 minutes.
    - cron: "17,42 * * * *"

permissions:
  contents: write

concurrency:
  # Shared with the other BRIM live-data writers so feed jobs do not try to
  # commit/push docs/data updates at the same time.
  group: live-data-feed-writes-${{ github.ref }}
  cancel-in-progress: false

  # Keep queued live-feed writers instead of allowing a newer queued writer to
  # replace an older pending one in this shared concurrency group.
  queue: max

jobs:
  build-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Report trigger
        shell: bash
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Workflow start UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Configured schedule: primary hh:17 UTC; backup hh:42 UTC"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether refresh is due
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          manifest_path = Path(
              "docs/data/wind/asos_awos_wind_feed_manifest.json"
          )

          should_run = True
          reason = "manual dispatch always runs"
          age_minutes = None

          if event == "schedule":
              reason = "manifest missing or unreadable"
              try:
                  manifest = json.loads(
                      manifest_path.read_text(encoding="utf-8")
                  )
                  stamp = (
                      manifest.get("build_time_utc")
                      or manifest.get("generated_utc")
                  )
                  if not stamp:
                      raise ValueError("manifest has no build timestamp")

                  built = dt.datetime.fromisoformat(
                      stamp.replace("Z", "+00:00")
                  )
                  now = dt.datetime.now(dt.timezone.utc)
                  age_minutes = (now - built).total_seconds() / 60.0

                  should_run = age_minutes >= 45.0
                  if should_run:
                      reason = (
                          f"published feed is {age_minutes:.1f} minutes old"
                      )
                  else:
                      reason = (
                          f"published feed is only "
                          f"{age_minutes:.1f} minutes old"
                      )
              except Exception as exc:
                  should_run = True
                  reason = f"freshness check failed: {exc}"

          print(f"Refresh due: {should_run}")
          print(f"Reason: {reason}")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(
                  "should_run="
                  + ("true" if should_run else "false")
                  + "\n"
              )
              fh.write(f"reason={reason}\n")
              if age_minutes is not None:
                  fh.write(f"age_minutes={age_minutes:.1f}\n")
          PY

      - name: Set up R
        if: steps.freshness.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        if: steps.freshness.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: asos-awos-wind-v1
          packages: |
            any::httr2
            any::jsonlite
            any::readr

      - name: Build observed wind speed + gusts feed
        if: steps.freshness.outputs.should_run == 'true'
        shell: Rscript {0}
        env:
          BRIM_OBS_BUILD_SANDBOX: "false"
          BRIM_OBS_BUILD_QA_ZIP: "true"
          BRIM_OBS_LOCAL_TZ: "America/Los_Angeles"
          BRIM_OBS_MAX_AGE_HOURS: "3.0"
          BRIM_OBS_STALE_AFTER_HOURS: "2.0"
        run: |
          source("scripts/build_asos_awos_wind_latest.R")

      - name: Upload QA artifact
        if: always() && steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asos-awos-wind-qa
          if-no-files-found: ignore
          path: |
            qa/wind/asos_awos/RTW_ASOS_latest_QA_upload.zip
            debug/wind/asos_awos/*.log

      - name: Publish updated observed wind feed
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated feed files are complete snapshots, not source text that
          # should be merged line-by-line. Preserve this run's payload outside
          # the checkout, sync to current origin/main, then restore and commit.
          publish_dir="${RUNNER_TEMP}/asos-awos-publish"
          rm -rf "${publish_dir}"
          mkdir -p "${publish_dir}"
          cp docs/data/wind/asos_awos_wind_latest.geojson "${publish_dir}/"
          cp docs/data/wind/asos_awos_wind_latest_summary.json "${publish_dir}/"
          cp docs/data/wind/asos_awos_wind_feed_manifest.json "${publish_dir}/"

          manifest_epoch() {
            python - "$1" <<'PY_EPOCH'
          import datetime as dt
          import json
          import sys
          from pathlib import Path
          
          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(0)
          
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          
          stamp = (
              data.get("generated_utc")
              or data.get("build_time_utc")
              or data.get("generated_at_utc")
          )
          if not stamp:
              raise SystemExit(0)
          
          try:
              value = dt.datetime.fromisoformat(
                  str(stamp).replace("Z", "+00:00")
              )
          except ValueError:
              raise SystemExit(0)
          
          if value.tzinfo is None:
              value = value.replace(tzinfo=dt.timezone.utc)
          print(int(value.timestamp()))
          PY_EPOCH
          }
          payload_epoch="$(manifest_epoch "${publish_dir}/asos_awos_wind_feed_manifest.json")"

          for attempt in 1 2 3 4 5; do
            echo "ASOS publish attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main

            remote_epoch="$(manifest_epoch docs/data/wind/asos_awos_wind_feed_manifest.json)"
            if [[ -n "${payload_epoch}" && -n "${remote_epoch}" ]] && \
               (( remote_epoch >= payload_epoch )); then
              echo "Remote ASOS feed is already as new or newer; skipping stale payload."
              exit 0
            fi

            cp "${publish_dir}/asos_awos_wind_latest.geojson" \
              docs/data/wind/asos_awos_wind_latest.geojson
            cp "${publish_dir}/asos_awos_wind_latest_summary.json" \
              docs/data/wind/asos_awos_wind_latest_summary.json
            cp "${publish_dir}/asos_awos_wind_feed_manifest.json" \
              docs/data/wind/asos_awos_wind_feed_manifest.json

            git add \
              docs/data/wind/asos_awos_wind_latest.geojson \
              docs/data/wind/asos_awos_wind_latest_summary.json \
              docs/data/wind/asos_awos_wind_feed_manifest.json

            if git diff --cached --quiet; then
              echo "No observed wind feed changes to commit."
              exit 0
            fi

            git commit -m "Update observed wind speed and gusts feed"
            if git push origin HEAD:main; then
              echo "Published observed wind feed."
              exit 0
            fi

            echo "Push raced with another repository update; retrying from current main."
            sleep $((attempt * 4))
          done

          echo "Could not publish observed wind feed after 5 attempts." >&2
          exit 1
