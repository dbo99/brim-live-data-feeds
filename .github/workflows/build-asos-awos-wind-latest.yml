name: Build ASOS/METAR observed wind latest

on:
  workflow_dispatch:
  schedule:
    # Primary hourly refresh at hh:17 UTC plus a backup opportunity at hh:42.
    # A freshness guard below skips the backup when the primary run published
    # successfully within the previous 45 minutes.
    - cron: "17,42 * * * *"

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.freshness.outputs.should_run }}

    steps:
      - name: Report trigger
        shell: bash
        run: |
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Workflow start UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Configured schedule: primary hh:17 UTC; backup hh:42 UTC"

      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Decide whether refresh is due
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          manifest_path = Path(
              "docs/data/wind/asos_awos_wind_feed_manifest.json"
          )

          should_run = True
          reason = "manual dispatch always runs"
          age_minutes = None

          if event == "schedule":
              reason = "manifest missing or unreadable"
              try:
                  manifest = json.loads(
                      manifest_path.read_text(encoding="utf-8")
                  )
                  stamp = (
                      manifest.get("build_time_utc")
                      or manifest.get("generated_utc")
                  )
                  if not stamp:
                      raise ValueError("manifest has no build timestamp")

                  built = dt.datetime.fromisoformat(
                      stamp.replace("Z", "+00:00")
                  )
                  now = dt.datetime.now(dt.timezone.utc)
                  age_minutes = (now - built).total_seconds() / 60.0

                  should_run = age_minutes >= 45.0
                  if should_run:
                      reason = (
                          f"published feed is {age_minutes:.1f} minutes old"
                      )
                  else:
                      reason = (
                          f"published feed is only "
                          f"{age_minutes:.1f} minutes old"
                      )
              except Exception as exc:
                  should_run = True
                  reason = f"freshness check failed: {exc}"

          print(f"Refresh due: {should_run}")
          print(f"Reason: {reason}")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(
                  "should_run="
                  + ("true" if should_run else "false")
                  + "\n"
              )
              fh.write(f"reason={reason}\n")
              if age_minutes is not None:
                  fh.write(f"age_minutes={age_minutes:.1f}\n")
          PY

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        if: steps.freshness.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        if: steps.freshness.outputs.should_run == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: asos-awos-wind-v1
          packages: |
            any::httr2
            any::jsonlite
            any::readr

      - name: Build isolated observed wind speed + gusts candidate
        if: steps.freshness.outputs.should_run == 'true'
        shell: Rscript {0}
        env:
          BRIM_OBS_PROJECT_ROOT: ${{ runner.temp }}/asos-awos-build-root
          BRIM_OBS_BUILD_SANDBOX: "false"
          BRIM_OBS_BUILD_QA_ZIP: "true"
          BRIM_OBS_LOCAL_TZ: "America/Los_Angeles"
          BRIM_OBS_MAX_AGE_HOURS: "3.0"
          BRIM_OBS_STALE_AFTER_HOURS: "2.0"
        run: |
          dir.create(Sys.getenv("BRIM_OBS_PROJECT_ROOT"), recursive = TRUE, showWarnings = FALSE)
          source(file.path(Sys.getenv("GITHUB_WORKSPACE"), "scripts", "build_asos_awos_wind_latest.R"))

      - name: Validate and describe ASOS/AWOS publication candidate
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          build_root="${RUNNER_TEMP}/asos-awos-build-root"
          candidate_artifact_root="${RUNNER_TEMP}/asos-awos-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/asos_awos_wind_publisher.py validate \
            --root "${build_root}"

          mkdir -p "$(dirname "${candidate_root}/docs/data/wind/asos_awos_wind_latest.geojson")"
          install -m 0644 \
            "${build_root}/docs/data/wind/asos_awos_wind_latest.geojson" \
            "${candidate_root}/docs/data/wind/asos_awos_wind_latest.geojson"
          install -m 0644 \
            "${build_root}/docs/data/wind/asos_awos_wind_latest_summary.json" \
            "${candidate_root}/docs/data/wind/asos_awos_wind_latest_summary.json"
          install -m 0644 \
            "${build_root}/docs/data/wind/asos_awos_wind_feed_manifest.json" \
            "${candidate_root}/docs/data/wind/asos_awos_wind_feed_manifest.json"

          python3 scripts/asos_awos_wind_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.build_time_utc' \
            "${candidate_root}/docs/data/wind/asos_awos_wind_feed_manifest.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id asos-awos-wind-latest \
            --semantic-key-type build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/wind/asos_awos_wind_latest.geojson \
            --allowlist docs/data/wind/asos_awos_wind_latest_summary.json \
            --allowlist docs/data/wind/asos_awos_wind_feed_manifest.json

      - name: Upload QA artifact
        if: always() && steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: asos-awos-wind-qa
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/asos-awos-build-root/qa/wind/asos_awos/RTW_ASOS_latest_QA_upload.zip
            ${{ runner.temp }}/asos-awos-build-root/debug/wind/asos_awos/*.log

      - name: Upload validated ASOS/AWOS publication candidate
        if: steps.freshness.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: asos-awos-wind-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asos-awos-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ needs.prepare-candidate.outputs.should_publish == 'true' && github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated ASOS/AWOS publication candidate
        uses: actions/download-artifact@v8
        with:
          name: asos-awos-wind-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/asos-awos-candidate

      - name: Reconcile and publish ASOS/AWOS candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/asos-awos-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id asos-awos-wind-latest \
            --target-ref refs/heads/main \
            --commit-subject "Update observed wind speed and gusts feed" \
            --allowlist docs/data/wind/asos_awos_wind_latest.geojson \
            --allowlist docs/data/wind/asos_awos_wind_latest_summary.json \
            --allowlist docs/data/wind/asos_awos_wind_feed_manifest.json \
            --candidate-validator scripts/asos_awos_wind_publisher.py \
            --reconcile-callback scripts/asos_awos_wind_publisher.py \
            --staged-validator scripts/asos_awos_wind_publisher.py
