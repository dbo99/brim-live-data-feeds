name: Build CDEC reservoir latest GeoJSON

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours at hh:29 UTC. This avoids the hourly ASOS writer at
    # hh:17 and the hourly GFS writer at hh:47.
    - cron: "29 */3 * * *"

permissions: {}

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out latest branch tip
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: ./.github/actions/setup-r-hardened

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: cdec-reservoir-v2-curl
          packages: |
            any::curl
            any::dplyr
            any::readr
            any::stringr
            any::lubridate
            any::jsonlite
            any::tibble
            any::purrr

      - name: Build latest CDEC reservoir GeoJSON
        shell: Rscript {0}
        env:
          CDEC_RESERVOIR_GEOJSON: ${{ runner.temp }}/cdec-reservoir-candidate/candidate/docs/data/cdec_reservoir_latest.geojson
          CDEC_RESERVOIR_SUMMARY_JSON: ${{ runner.temp }}/cdec-reservoir-candidate/candidate/docs/data/cdec_reservoir_latest_summary.json
        run: |
          source("scripts/build_cdec_reservoir_latest.R")

      - name: Validate and describe candidate artifact
        shell: bash
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cdec-reservoir-candidate"
          candidate_root="${candidate_artifact_root}/candidate"

          python3 scripts/cdec_reservoir_publisher.py validate \
            --root "${candidate_root}"

          semantic_time="$(jq -er '.feed_build_time_utc' \
            "${candidate_root}/docs/data/cdec_reservoir_latest_summary.json")"

          python3 scripts/main_publisher.py prepare \
            --candidate-root "${candidate_root}" \
            --output "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cdec-reservoir-feed \
            --semantic-key-type feed_build_time_utc \
            --semantic-key "${semantic_time}" \
            --source-event-sha "${GITHUB_SHA}" \
            --allowlist docs/data/cdec_reservoir_latest.geojson \
            --allowlist docs/data/cdec_reservoir_latest_summary.json

      - name: Upload validated CDEC publication candidate
        uses: actions/upload-artifact@v7
        with:
          name: cdec-reservoir-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cdec-reservoir-candidate
          if-no-files-found: error
          retention-days: 2

  publish-to-main:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: prepare-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: brim-live-main-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out source event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated CDEC publication candidate
        uses: actions/download-artifact@v8
        with:
          name: cdec-reservoir-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cdec-reservoir-candidate

      - name: Reconcile and publish CDEC candidate onto current main
        shell: bash
        env:
          BRIM_LIVE_MAIN_PUBLISH: "true"
        run: |
          set -euo pipefail

          candidate_artifact_root="${RUNNER_TEMP}/cdec-reservoir-candidate"

          python3 scripts/main_publisher.py publish \
            --repo . \
            --candidate-root "${candidate_artifact_root}/candidate" \
            --metadata "${candidate_artifact_root}/candidate-metadata.json" \
            --product-id cdec-reservoir-feed \
            --target-ref refs/heads/main \
            --commit-subject "Update CDEC reservoir feed" \
            --allowlist docs/data/cdec_reservoir_latest.geojson \
            --allowlist docs/data/cdec_reservoir_latest_summary.json \
            --candidate-validator scripts/cdec_reservoir_publisher.py \
            --reconcile-callback scripts/cdec_reservoir_publisher.py \
            --staged-validator scripts/cdec_reservoir_publisher.py
