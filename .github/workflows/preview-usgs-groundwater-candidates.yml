name: Preview USGS groundwater candidate discovery

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Comma-separated lookback windows in days. Leave blank to use script defaults."
        required: false
        default: ""
      bbox:
        description: "Discovery bbox as xmin,ymin,xmax,ymax. Leave blank to use script default."
        required: false
        default: ""
  schedule:
    - cron: "23 13 * * 1"

permissions:
  contents: read

jobs:
  preview-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates

      - name: Install minimal R packages
        run: |
          Rscript -e 'pkgs <- c("jsonlite"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) install.packages(missing, repos = "https://cloud.r-project.org"); missing_after <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing_after)) stop("Missing R package(s): ", paste(missing_after, collapse = ", "))'

      - name: Show script dependency guard
        shell: bash
        run: |
          echo "Checking preview script for unintended heavy package dependencies..."
          if awk 'BEGIN{bad=0} /^[[:space:]]*#/ {next} /(dataRetrieval|dplyr|readr|tibble|sf|httr2)/ {print FNR ":" $0; bad=1} END{exit bad}' scripts/preview_usgs_groundwater_candidate_discovery.R; then
            echo "Dependency guard passed."
          else
            echo "Unexpected heavy dependency reference found in preview script."
            exit 1
          fi

      - name: Run candidate discovery preview
        shell: bash
        env:
          CLI_NO_PROGRESS: "true"
          R_CLI_NUM_COLORS: "1"
        run: |
          if [ -n "${{ github.event.inputs.lookback_days || '' }}" ]; then
            export BRIM_GW_PREVIEW_LOOKBACK_DAYS="${{ github.event.inputs.lookback_days }}"
          fi
          if [ -n "${{ github.event.inputs.bbox || '' }}" ]; then
            export BRIM_GW_PREVIEW_BBOX="${{ github.event.inputs.bbox }}"
          fi
          Rscript -e 'source("scripts/preview_usgs_groundwater_candidate_discovery.R")'

      - name: Upload preview QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: usgs-groundwater-candidate-discovery-preview
          path: qa/usgs_groundwater_candidate_discovery_preview/**
          if-no-files-found: error
          retention-days: 30
