name: Preview USGS groundwater candidate discovery

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Optional comma-separated lookback windows. Blank uses script default from R script. Bbox is fixed/validated in the script."
        required: false
        default: ""
  schedule:
    # Weekly Monday morning UTC. This is preview/QA only.
    - cron: "20 11 * * 1"

permissions:
  contents: read

env:
  CLI_NO_PROGRESS: "true"
  R_CLI_NUM_COLORS: "1"

jobs:
  preview-candidates:
    name: preview-candidates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates

      - name: Install minimal R package
        run: |
          Rscript -e 'if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite", repos = "https://cloud.r-project.org"); stopifnot(requireNamespace("jsonlite", quietly = TRUE))'

      - name: Apply optional workflow inputs
        shell: bash
        run: |
          if [ -n "${{ inputs.lookback_days }}" ]; then
            echo "BRIM_GW_PREVIEW_LOOKBACK_DAYS=${{ inputs.lookback_days }}" >> "$GITHUB_ENV"
          fi

      - name: Show script dependency guard
        shell: bash
        run: |
          echo "Checking preview script for unintended package dependencies in executable code..."
          # Ignore full-line comments before scanning. This keeps documentation
          # comments from tripping the guard while still catching accidental
          # library(), require(), or requireNamespace() calls.
          if grep -nEv '^[[:space:]]*#|^[[:space:]]*$' scripts/preview_usgs_groundwater_candidate_discovery.R | \
             grep -Ei 'library\((dataRetrieval|dplyr|readr|tibble|sf|httr2|curl)\)|require\((dataRetrieval|dplyr|readr|tibble|sf|httr2|curl)\)|requireNamespace\("(dataRetrieval|dplyr|readr|tibble|sf|httr2|curl)"' ; then
            echo "Unexpected heavy dependency call found in preview script."
            exit 1
          fi
          echo "Dependency guard passed."

      - name: Run candidate discovery preview
        run: |
          Rscript -e 'source("scripts/preview_usgs_groundwater_candidate_discovery.R")'

      - name: Upload preview QA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usgs-groundwater-candidate-discovery-preview
          path: qa/usgs_groundwater_candidate_discovery_preview/**
          if-no-files-found: warn
          retention-days: 90
