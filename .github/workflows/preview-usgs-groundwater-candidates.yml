name: Preview USGS groundwater candidate discovery

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Optional comma-separated lookback windows in days. Leave blank to use script defaults."
        required: false
        default: ""
  schedule:
    # Weekly preview. GitHub schedules are UTC and may not run exactly on the minute.
    - cron: "37 13 * * 1"

permissions:
  contents: read

jobs:
  preview-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prefer Canonical Ubuntu APT mirror with Azure fallback
        shell: bash
        run: sudo bash scripts/configure_apt_mirror_order.sh

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install Linux system libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            pkg-config

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: usgs-groundwater-preview-dataretrieval-v1
          packages: |
            any::dataRetrieval
            any::dplyr
            any::readr
            any::jsonlite
            any::tibble
            any::curl

      - name: Preview groundwater candidate discovery
        shell: Rscript {0}
        env:
          # Optional: create this repository secret for higher USGS Water Data API rate limits.
          API_USGS_PAT: ${{ secrets.API_USGS_PAT }}
          BRIM_GW_PREVIEW_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
          BRIM_GW_PREVIEW_PARAMETER_CODE: "72019"
        run: |
          source("scripts/preview_usgs_groundwater_candidate_discovery.R")

      - name: Upload preview QA artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: usgs-groundwater-candidate-discovery-preview
          path: qa/usgs_groundwater_candidate_discovery_preview/**
          if-no-files-found: warn
          retention-days: 30
