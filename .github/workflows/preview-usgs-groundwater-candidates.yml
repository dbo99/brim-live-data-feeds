name: Preview USGS groundwater candidate discovery

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Comma-separated lookback windows in days. Leave blank to use script defaults."
        required: false
        default: ""
      bbox:
        description: "Discovery bbox xmin,ymin,xmax,ymax. Leave blank to use script default."
        required: false
        default: ""
  schedule:
    - cron: "27 11 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  preview-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BRIM_GW_PREVIEW_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
      BRIM_GW_PREVIEW_BBOX: ${{ github.event.inputs.bbox }}
      BRIM_GW_PREVIEW_PARAMETER_CODE: "72019"
      CLI_NO_PROGRESS: "true"
      R_CLI_NUM_COLORS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system curl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl \
            ca-certificates

      - name: Install minimal R packages
        run: |
          Rscript -e 'if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite", repos = "https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly = TRUE))'

      - name: Show script dependency guard
        run: |
          echo "Checking preview script for unintended heavy package dependencies..."
          if grep -En "dataRetrieval|dplyr|readr|tibble|sf|httr2|library\(|require\(" scripts/preview_usgs_groundwater_candidate_discovery.R; then
            echo "Unexpected dependency reference found in preview script."
            exit 1
          fi
          echo "Dependency guard passed."

      - name: Run candidate discovery preview
        run: |
          Rscript -e 'source("scripts/preview_usgs_groundwater_candidate_discovery.R")'

      - name: Upload preview QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: usgs-groundwater-candidate-discovery-preview
          path: qa/usgs_groundwater_candidate_discovery_preview/**
          if-no-files-found: error
          retention-days: 30
