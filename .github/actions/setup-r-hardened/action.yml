name: Set up hardened BRIM R runtime
description: Install the proven BRIM R runtime with bounded setup retries.

runs:
  using: composite
  steps:
    - name: Set up R 4.6.1 (attempt 1 of 3)
      id: setup_r_1
      continue-on-error: true
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.6.1"
        use-public-rspm: "true"

    - name: Wait before R setup attempt 2
      if: ${{ steps.setup_r_1.outcome == 'failure' }}
      shell: bash
      run: sleep 5

    - name: Set up R 4.6.1 (attempt 2 of 3)
      id: setup_r_2
      if: ${{ steps.setup_r_1.outcome == 'failure' }}
      continue-on-error: true
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.6.1"
        use-public-rspm: "true"

    - name: Wait before R setup attempt 3
      if: ${{ steps.setup_r_2.outcome == 'failure' }}
      shell: bash
      run: sleep 15

    - name: Set up R 4.6.1 (attempt 3 of 3)
      if: ${{ steps.setup_r_2.outcome == 'failure' }}
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.6.1"
        use-public-rspm: "true"
